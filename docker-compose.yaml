services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nimbo-zookeeper-dev
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - nimbo-dev-network
    profiles:
      - full
      - infra

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nimbo-kafka-dev
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - nimbo-dev-network
    profiles:
      - full
      - infra

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: nimbo-namenode-dev
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode-data:/hadoop/dfs/name
    networks:
      - nimbo-dev-network
    profiles:
      - full
      - infra

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: nimbo-datanode-dev
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - datanode-data:/hadoop/dfs/data
    networks:
      - nimbo-dev-network
    profiles:
      - full
      - infra

  ingester:
    build: .
    container_name: nimbo-ingester-dev
    depends_on:
      - kafka
      - namenode
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - HDFS_URI=hdfs://namenode:9000
      - KAFKA_TOPIC=netflow
      - KAFKA_CONSUMER_GROUP=netflow-java-consumer8-dev
      - HDFS_BASE_PATH=/data/test/netflow/
    networks:
      - nimbo-dev-network
    profiles:
      - full

networks:
  nimbo-dev-network:
    name: nimbo-dev-network

volumes:
  namenode-data:
  datanode-data: