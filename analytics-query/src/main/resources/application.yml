spring:
  application:
    name: analytics-query

  lifecycle:
    timeout-per-shutdown-phase: 20s

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    enabled: true
    path: /api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

  packages-to-scan: com.nimbo.analyticsquery.controller
  paths-to-match: /analytics/**

analytics-query:
  explanation:
    timeout: ${ANALYTICS_QUERY_EXPLANATION_TIMEOUT:10s}
    max-rows: ${ANALYTICS_QUERY_EXPLANATION_MAX_ROWS:20}
    max-payload-characters: ${ANALYTICS_QUERY_EXPLANATION_MAX_PAYLOAD_CHARACTERS:32000}

  intent:
    max-time-range: ${ANALYTICS_QUERY_MAX_TIME_RANGE:7d}

  schema:
    starrocks:
      enabled: ${ANALYTICS_QUERY_STARROCKS_CATALOG_ENABLED:false}
      jdbc-url: ${ANALYTICS_QUERY_STARROCKS_JDBC_URL:}
      username: ${ANALYTICS_QUERY_STARROCKS_USERNAME:}
      password: ${ANALYTICS_QUERY_STARROCKS_PASSWORD:}
      database: ${ANALYTICS_QUERY_STARROCKS_DATABASE:nimbo}
      table: ${ANALYTICS_QUERY_STARROCKS_TABLE:netflow}
      refresh-interval: ${ANALYTICS_QUERY_STARROCKS_REFRESH_INTERVAL:15m}
      connection-timeout: ${ANALYTICS_QUERY_STARROCKS_CONNECTION_TIMEOUT:5s}
      pool-size: ${ANALYTICS_QUERY_STARROCKS_POOL_SIZE:2}
      query-timeout-seconds: ${ANALYTICS_QUERY_STARROCKS_QUERY_TIMEOUT_SECONDS:10}

  sql-generation:
    max-sql-length: 20000

  query-plan-safety:
    explain-timeout: ${ANALYTICS_QUERY_EXPLAIN_TIMEOUT:5s}
    max-explain-size: ${ANALYTICS_QUERY_MAX_EXPLAIN_SIZE:256KB}
    max-estimated-rows: ${ANALYTICS_QUERY_MAX_ESTIMATED_ROWS:10000000}
    postgres-max-total-cost: ${ANALYTICS_QUERY_POSTGRES_MAX_TOTAL_COST:1000000}

  sql-execution:
    statement-timeout: ${ANALYTICS_QUERY_SQL_STATEMENT_TIMEOUT:10s}
    max-result-size: ${ANALYTICS_QUERY_SQL_MAX_RESULT_SIZE:2MB}

    postgresql:
      enabled: ${ANALYTICS_QUERY_POSTGRESQL_EXECUTION_ENABLED:false}
      jdbc-url: ${ANALYTICS_QUERY_POSTGRESQL_JDBC_URL:}
      username: ${ANALYTICS_QUERY_POSTGRESQL_USERNAME:}
      password: ${ANALYTICS_QUERY_POSTGRESQL_PASSWORD:}
      pool-size: ${ANALYTICS_QUERY_POSTGRESQL_POOL_SIZE:2}
      connection-timeout: ${ANALYTICS_QUERY_POSTGRESQL_CONNECTION_TIMEOUT:3s}

    starrocks:
      enabled: ${ANALYTICS_QUERY_STARROCKS_EXECUTION_ENABLED:false}
      jdbc-url: ${ANALYTICS_QUERY_STARROCKS_EXECUTION_JDBC_URL:}
      username: ${ANALYTICS_QUERY_STARROCKS_EXECUTION_USERNAME:}
      password: ${ANALYTICS_QUERY_STARROCKS_EXECUTION_PASSWORD:}
      pool-size: ${ANALYTICS_QUERY_STARROCKS_EXECUTION_POOL_SIZE:2}
      connection-timeout: ${ANALYTICS_QUERY_STARROCKS_EXECUTION_CONNECTION_TIMEOUT:3s}

llm:
  base-url: ${ANALYTICS_QUERY_LLM_BASE_URL:http://saca-api.inside.sahab.ir:3100}
  api-key: ${ANALYTICS_QUERY_LLM_API_KEY}
  model: ${ANALYTICS_QUERY_LLM_MODEL:AliBaba/Qwen3.8-27B}
  chat-completions-path: ${ANALYTICS_QUERY_LLM_CHAT_COMPLETIONS_PATH:/v1/chat/completions}

  timeout:
    connect: ${ANALYTICS_QUERY_LLM_CONNECT_TIMEOUT:10s}
    read: ${ANALYTICS_QUERY_LLM_READ_TIMEOUT:240s}

rest-api:
  base-url: ${ANALYTICS_QUERY_REST_API_BASE_URL}
  timeout:
    connect: ${ANALYTICS_QUERY_REST_API_CONNECT_TIMEOUT:3s}
    read: ${ANALYTICS_QUERY_REST_API_READ_TIMEOUT:15s}

server:
  port: ${SERVER_PORT:8080}

  servlet:
    context-path: /api

  tomcat:
    threads:
      max: ${ANALYTICS_QUERY_HTTP_MAX_THREADS:32}
    max-connections: ${ANALYTICS_QUERY_HTTP_MAX_CONNECTIONS:64}
    accept-count: ${ANALYTICS_QUERY_HTTP_ACCEPT_COUNT:32}

  shutdown: graceful

management:
  prometheus:
    metrics:
      export:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
