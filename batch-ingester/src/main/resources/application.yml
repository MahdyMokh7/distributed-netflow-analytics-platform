spring:
  application:
    name: nimbo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  output:
    ansi:
      enabled: always

logging:
  level:
    root: INFO
    com.nimbo.ingester: INFO
    org.apache.kafka: WARN
    org.apache.hadoop: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

rolling:
  max-record-count: ${ROLLING_MAX_RECORD_COUNT:3100000}
  max-size-bytes: ${ROLLING_MAX_SIZE_BYTES:311673700}
  max-age: ${ROLLING_MAX_AGE:5m}

storage:
  parquet:
    compression-codec: ${PARQUET_COMPRESSION:ZSTD}
    block-size-bytes: ${PARQUET_BLOCK_SIZE:134217728}
    page-size-bytes: ${PARQUET_PAGE_SIZE:1048576}
    enable-dictionary: ${PARQUET_ENABLE_DICTIONARY:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always

    metrics:
      tags:
        application: ${spring.application.name}

      distribution:
        percentiles-histogram:
          http.server.requests: true

ingester:
  schema-registry:
    url: ${SCHEMA_REGISTRY_URL}
    subject: ${SCHEMA_REGISTRY_SUBJECT:netflow-value}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:10.10.61.51:9092,10.10.61.53:9092,10.10.61.54:9092}
    topic: ${KAFKA_TOPIC:netflow}
    dlq-topic: ${KAFKA_DLQ_TOPIC:netflow-dlq}
    consumer-group: ${KAFKA_CONSUMER_GROUP:netflow-java-consumer-scalled}
    auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
    enable-auto-commit: false
    poll-timeout-ms: 1000
    max-poll-records: 5000
    session-timeout-ms: 30000
    heartbeat-interval-ms: 3000
    max-poll-interval-ms: 300000
    consumer-instances: ${CONSUMER_INSTANCES:1}
