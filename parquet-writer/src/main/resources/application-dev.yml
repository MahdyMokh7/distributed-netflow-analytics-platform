# Development-specific configuration
spring:
  config:
    activate:
      on-profile: dev

kafka:
  bootstrap-servers: kafka:9092

hdfs:
  uri: hdfs://namenode:9000

logging:
  level:
    com.nimbo.application: DEBUG
    com.nimbo.ingestion: DEBUG

storage:
  hdfs:
    uri: ${HDFS_URI:hdfs://namenode:9000}
    user: root
    base-path: ${HDFS_BASE_PATH:/netflow/parquetFiles}

ingester:
  kafka:
    consumer-instances: ${CONSUMER_INSTANCES:1}
