  global:
  scrape_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:

  # NODE EXPORTERS

  - job_name: node-exporters
    static_configs:
      - targets:
        - '10.10.61.51:9100'
        labels:
          node: node1
          instance: node1

      - targets:
        - '10.10.61.52:9100'
        labels:
          node: node2
          instance: node2

      - targets:
        - '10.10.61.53:9100'
        labels:
          node: node3
          instance: node3

      - targets:
        - '10.10.61.54:9100'
        labels:
          node: node4
          instance: node4


  # APPLICATIONS

  - job_name: rest-api
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets:
        - '10.10.61.51:18083'
        labels:
          instance: rest-api


  - job_name: batch-ingester
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
        - '10.10.61.52:18080'
        labels:
          instance: batch-ingester


  - job_name: batch-processor
