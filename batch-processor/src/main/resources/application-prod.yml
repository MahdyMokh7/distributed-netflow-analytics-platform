spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db.migration

server:
  port: ${SERVER_PORT:18081}

spark:
  master: spark://10.10.61.71:7077
  app-name: nimbo-batch-processor
  executor-memory: 1g
  executor-cores: 1
  num-executors: 3
  max-cores: 3
  files-max-partition-bytes: 64m
  shuffle-partitions: 12
  session-time-zone: UTC
  event-log-enabled: true
  event-log-directory: ${HDFS_URI:hdfs://10.10.61.53:8020}/spark-history
  adaptive-enabled: true
  adaptive-coalesce-partitions-enabled: true
  serializer: org.apache.spark.serializer.KryoSerializer
  ui-enabled: true
  io-mode-default: NIO
  driver-host: ${DRIVER_HOST:10.10.61.53}
  driver-bind-address: 0.0.0.0
  speculation: false
  jars-path: ${SPARK_JARS_PATH:/tmp/batch-processor-spark.jar}
  executor-extra-java-options: "--add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.base/sun.nio.cs=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=java.base/sun.net.util=ALL-UNNAMED"

hdfs:
  uri: ${HDFS_URI:hdfs://10.10.61.53:8020}
  parquet-path: /netflow/parquetFiles/

output:
  mode: both

postgres:
  host: 10.10.61.70
  port: 5432
  database: nimbo_db
  username: ${DB_USERNAME:nimbo_user}
  password: ${DB_PASSWORD:123456}
  batch-size: 5000
  writer-partitions: 4

  driver-pool:
    size: 4
    connection-timeout: 10000
    pool-name: nimbo-batch-pg-pool

  executor-pool:
    max-pool-size: ${EXECUTOR_POOL_SIZE:1}
    minimum-idle: ${EXECUTOR_MINIMUM_IDLE:0}
    connection-timeout-ms: ${EXECUTOR_CONNECTION_TIMEOUT:5000}
    idle-timeout-ms: ${EXECUTOR_IDLE_TIMEOUT:60000}
    max-lifetime-ms: ${EXECUTOR_MAX_LIFETIME:1800000}
    pool-name: ${EXECUTOR_POOL_NAME:JdbiExecutorPool}

  retry:
    max-attempts: 5
    initial-delay-ms: 2000
    max-delay-ms: 30000

batch:
  schedule: "0 */10 * * * ?"
  window-duration: "1 hour"
  enabled: true
  max-files-per-batch: 2
