spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db.migration

spark:
  master: spark://10.10.61.71:7077
  app-name: nimbo-batch-processor
  executor-memory: 2g
  executor-cores: 2
  num-executors: 2
  driver-memory: 1g
  shuffle-partitions: 12
  adaptive-enabled: true
  adaptive-coalesce-partitions-enabled: true
  serializer: org.apache.spark.serializer.KryoSerializer
  ui-enabled: true
  io-mode-default: NIO
  driver-host: ${DRIVER_HOST:10.10.61.53}
  driver-bind-address: 0.0.0.0

hdfs:
  uri: hdfs://10.10.61.53:8020
  parquet-path: /netflow/parquetFiles/

output:
  mode: database

postgres:
  host: 10.10.61.70
  port: 5432
  database: nimbo_db
  username: ${DB_USERNAME:nimbo_user}
  password: ${DB_PASSWORD:123456}
  batch-size: 1000

  pool:
    size: 20
    connection-timeout: 10000
    pool-name: nimbo-batch-pg-pool

  retry:
    max-attempts: 5
    initial-delay-ms: 2000
    max-delay-ms: 30000

batch:
  schedule: "0 */2 * * * ?"  ## should change
  window-duration: "1 hour"
  enabled: true