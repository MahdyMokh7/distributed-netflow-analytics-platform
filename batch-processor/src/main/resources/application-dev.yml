spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db.migration

spark:
  master: local[*]
  app-name: nimbo-batch-processor-dev
  executor-memory: 2g
  executor-cores: 2
  num-executors: 2
  driver-memory: 1g
  shuffle-partitions: 20
  adaptive-enabled: true
  adaptive-coalesce-partitions-enabled: true
  serializer: org.apache.spark.serializer.KryoSerializer
  ui-enabled: true
  io-mode-default: NIO

hdfs:
  uri: hdfs://10.10.61.53:8020
  parquet-path: /netflow/parquetFiles-new/

output:
  mode: both

postgres:
  host: localhost
  port: 5432
  database: nimbo_db
  username: nimbo_user
  password: 123456
  batch-size: 1000

  pool:
    size: 20
    connection-timeout: 10000
    pool-name: nimbo-batch-pg-pool

  retry:
    max-attempts: 3
    initial-delay-ms: 1000
    max-delay-ms: 10000

batch:
  schedule: "0 */2 * * * ?"
  window-duration: "1 hour"
  enabled: true
  max-files-per-batch: 10