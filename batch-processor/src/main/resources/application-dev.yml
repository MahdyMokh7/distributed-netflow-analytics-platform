spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db.migration

spark:
  master: local[*]
  app-name: nimbo-batch-processor-dev
  executor-memory: 2g
  executor-cores: 2
  num-executors: 2
  driver-memory: 2g
  shuffle-partitions: 20
  adaptive-enabled: true
  adaptive-coalesce-partitions-enabled: true
  serializer: org.apache.spark.serializer.KryoSerializer
  ui-enabled: false
  io-mode-default: NIO
  speculation: false

hdfs:
  uri: hdfs://10.10.61.53:8020
  parquet-path: /netflow/parquetFiles/

output:
  mode: both

postgres:
  host: localhost
  port: 5432
  database: nimbo_db
  username: nimbo_user
  password: 123456
  batch-size: 2000
  writer-partitions: 4

  driver-pool:
    size: 4
    connection-timeout: 10000
    pool-name: nimbo-batch-pg-pool

  executor-pool:
    max-pool-size: ${EXECUTOR_POOL_SIZE:1}
    minimum-idle: ${EXECUTOR_MINIMUM_IDLE:0}
    connection-timeout-ms: ${EXECUTOR_CONNECTION_TIMEOUT:5000}
    idle-timeout-ms: ${EXECUTOR_IDLE_TIMEOUT:60000}
    max-lifetime-ms: ${EXECUTOR_MAX_LIFETIME:1800000}
    pool-name: ${EXECUTOR_POOL_NAME:JdbiExecutorPool}

  retry:
    max-attempts: 3
    initial-delay-ms: 1000
    max-delay-ms: 10000

batch:
  schedule: "0 */3 * * * ?"
  window-duration: "1 hour"
  enabled: true
  max-files-per-batch: 5
