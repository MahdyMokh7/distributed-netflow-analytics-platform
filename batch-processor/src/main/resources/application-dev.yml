spark:
  master: local[*]
  app-name: nimbo-batch-processor-dev
  executor-memory: 2g
  executor-cores: 2
  num-executors: 2
  driver-memory: 1g
  shuffle-partitions: 20
  adaptive-enabled: true
  adaptive-coalesce-partitions-enabled: true
  serializer: org.apache.spark.serializer.KryoSerializer
  ui-enabled: true
  io-mode-default: NIO

hdfs:
  uri: hdfs://10.10.61.53:8020
  parquet-path: /netflow/parquetFiles/

output:
  mode: console

postgres:
  host: 10.10.61.70
  port: 5432
  database: nimbo_db
  username: nimbo_batch
  password: 123456
  pool-size: 5

batch:
  schedule: "0 */5 * * * ?"
  window-hours: 1
  enabled: true