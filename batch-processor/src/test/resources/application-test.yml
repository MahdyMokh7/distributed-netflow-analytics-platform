spring:
  application:
    name: batch-processor-test

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db.migration

logging:
  level:
    com.nimbo.batch: DEBUG
    org.apache.spark: WARN
    org.apache.hadoop: WARN
    org.testcontainers: INFO

spark:
  master: local[*]
  app-name: nimbo-batch-processor-test
  adaptive-enabled: true
  adaptive-coalesce-partitions-enabled: true
  ui-enabled: false
  io-mode-default: NIO

hdfs:
  uri: hdfs://10.10.61.53:8020
  parquet-path: /netflow/parquetFiles-test/

output:
  mode: console

postgres:
  host: localhost
  port: 5432
  database: test_db
  username: test_user
  password: test_pass
  batch-size: 100

  driver-pool:
    size: 2
    connection-timeout: 10000
    pool-name: nimbo-batch-test-driver-pool

  executor-pool:
    max-pool-size: 1
    connection-timeout-ms: 3000
    idle-timeout-ms: 30000
    max-lifetime-ms: 60000
    pool-name: nimbo-batch-test-executor-pool

  retry:
    max-attempts: 2
    initial-delay-ms: 500
    max-delay-ms: 2000

batch:
  schedule: "0 */5 * * * ?"
  window-duration: "1 hour"
  enabled: true
  max-files-per-batch: 5

test:
  parquet:
    local-path: src/test/resources/sample-data/parquet/
    empty-path: src/test/resources/empty/
    invalid-path: hdfs://invalid/path/
    sample-path: src/test/resources/sample-data/
    records-per-file: 1000
    files-per-partition: 3