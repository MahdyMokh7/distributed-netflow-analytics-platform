spring:
  application:
    name: batch-processor-test

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db.migration
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:test_db}
    user: ${POSTGRES_USER:test_user}
    password: ${POSTGRES_PASSWORD:test_pass}

logging:
  level:
    com.nimbo.batch: DEBUG
    com.nimbo.batch.discovery: DEBUG
    com.nimbo.batch.processor: DEBUG
    com.nimbo.batch.writer: DEBUG
    org.apache.spark: WARN
    org.apache.hadoop: WARN
    org.apache.parquet: WARN
    org.testcontainers: INFO
    org.flywaydb: INFO
    org.jdbi: DEBUG

spark:
  master: local[2]
  app-name: nimbo-batch-processor-test
  shuffle-partitions: 2
  adaptive-enabled: true
  adaptive-coalesce-partitions-enabled: true
  serializer: org.apache.spark.serializer.KryoSerializer
  ui-enabled: false
  io-mode-default: NIO
  speculation: false
  executor-extra-java-options: "--add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.base/sun.nio.cs=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=java.base/sun.net.util=ALL-UNNAMED"

hdfs:
  uri: file://${java.io.tmpdir}/nimbo-test/parquet
  parquet-path: /

output:
  mode: both

postgres:
  driver-class-name: org.postgresql.Driver
  host: ${POSTGRES_HOST:localhost}
  port: ${POSTGRES_PORT:5432}
  database: ${POSTGRES_DB:test_db}
  username: ${POSTGRES_USER:test_user}
  password: ${POSTGRES_PASSWORD:test_pass}
  batch-size: 100
  writer-partitions: 1

  driver-pool:
    size: 2
    connection-timeout: 10000
    pool-name: nimbo-batch-test-driver-pool

  executor-pool:
    max-pool-size: 1
    minimum-idle: 0
    connection-timeout-ms: 3000
    idle-timeout-ms: 30000
    max-lifetime-ms: 60000
    pool-name: nimbo-batch-test-executor-pool

  retry:
    max-attempts: 2
    initial-delay-ms: 500
    max-delay-ms: 2000

batch:
  schedule: "-"
  window-duration: "1 hour"
  enabled: true
  max-files-per-batch: 5

test:
  parquet:
    records-per-file: 200
    base-timestamp: 2026-08-27T10:00:00Z
    known-ips:
      - "192.168.1.100"
      - "192.168.1.101"
      - "10.0.0.1"
      - "10.0.0.2"
    full-batch-files: 5
    incremental-first-batch: 3
    incremental-additional: 2
    max-files-test-total: 10
