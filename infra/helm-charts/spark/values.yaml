image:
  repository: zoraq.inside.sahab.ir:9462/nimbyte-spark
  tag: "4.1.1-1"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: spark

master:
  replicas: 1
  terminationGracePeriodSeconds: 60

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

worker:
  replicaCount: 4
  terminationGracePeriodSeconds: 60
  cores: 4
  memory: 4g
  rpcPort: 7078

  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 6Gi

  storage:
    size: 20Gi
    storageClass: disk1
    mountPath: /opt/spark/work
    workDirectory: /opt/spark/work
    localDirectory: /opt/spark/work/local
    initializePermissions: true

historyServer:
  replicas: 1
  terminationGracePeriodSeconds: 60

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

spark:
  shufflePartitions: 50
  serializer: org.apache.spark.serializer.KryoSerializer
  timezone: UTC
  adaptiveEnabled: true
  shuffleCompress: true
  ioCompressionCodec: lz4
  driverBindAddress: 0.0.0.0

  eventLog:
    enabled: true
    directory: hdfs://team1/spark-history

  historyServer:
    cleaner:
      enabled: true
      interval: 1d
      maxAge: 7d

  workerCleanup:
    enabled: true
    intervalSeconds: 86400     # 1 day
    appDataTtlSeconds: 172800  # 2 days

hadoop:
  defaultFs: hdfs://team1
  nameservice: team1
  namenodes:
    team1-node1: 10.10.61.51:8020
    team1-node2: 10.10.61.52:8020
    team1-node3: 10.10.61.53:8020
  failoverProxyProvider: org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider

metrics:
  enabled: true
  prometheus:
    path: /metrics/prometheus
    masterPath: /metrics/master/prometheus
    applicationsPath: /metrics/applications/prometheus
    jvmSourceEnabled: true

service:
  master:
    type: ClusterIP
    rpcPort: 7077
    uiPort: 8080
    externalUi:
      enabled: true
      type: LoadBalancer
      port: 80
      loadBalancerIP: 10.10.61.71
      annotations: {}
      loadBalancerSourceRanges: []
  worker:
    type: ClusterIP
    uiPort: 8081
    headless: true
  historyServer:
    type: ClusterIP
    port: 18080
    externalUi:
      enabled: true
      type: LoadBalancer
      port: 80
      loadBalancerIP: 10.10.61.72
      annotations: {}
      loadBalancerSourceRanges: []

affinity:
  workers:
    enabled: true