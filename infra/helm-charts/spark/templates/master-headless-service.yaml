apiVersion: v1
kind: Service
metadata:
  name: {{ include "spark.fullname" . }}-master-headless
  labels:
    {{- include "spark.labels" . | nindent 4 }}
    component: master
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: spark
      port: {{ .Values.service.master.rpcPort }}
      targetPort: spark
      protocol: TCP
  selector:
    {{- include "spark.selectorLabels" . | nindent 4 }}
    component: master
