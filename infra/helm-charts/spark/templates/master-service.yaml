apiVersion: v1
kind: Service

metadata:
  name: {{ include "spark.fullname" . }}-master
  labels:
    {{- include "spark.labels" . | nindent 4 }}
    component: master

spec:
  type: {{ .Values.service.master.type }}

  ports:
    - name: spark
      port: {{ .Values.service.master.rpcPort }}
      targetPort: {{ .Values.service.master.rpcPort }}
      protocol: TCP
    - name: web-ui
      port: {{ .Values.service.master.uiPort }}
      targetPort: {{ .Values.service.master.uiPort }}
      protocol: TCP

  selector:
    {{- include "spark.selectorLabels" . | nindent 4 }}
    component: master
