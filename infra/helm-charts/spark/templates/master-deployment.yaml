apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "spark.fullname" . }}-master
  labels:
    {{- include "spark.labels" . | nindent 4 }}
    component: master

spec:
  replicas: {{ .Values.master.replicas }}

  strategy:
    type: Recreate

  selector:
    matchLabels:
      {{- include "spark.selectorLabels" . | nindent 6 }}
      component: master

  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "spark.labels" . | nindent 8 }}
        component: master

    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: spark-master

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - /opt/spark/sbin/start-master.sh

          env:
            - name: SPARK_NO_DAEMONIZE
              value: "true"
            - name: SPARK_MASTER_PORT
              value: "{{ .Values.service.master.rpcPort }}"

          ports:
            - name: spark
              containerPort: {{ .Values.service.master.rpcPort }}

            - name: web-ui
              containerPort: {{ .Values.service.master.uiPort }}

          startupProbe:
            httpGet:
              path: /
              port: web-ui
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: spark
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: spark
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            {{- toYaml .Values.master.resources | nindent 12 }}

          volumeMounts:
            - name: spark-config
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
            - name: spark-config
              mountPath: /opt/spark/conf/core-site.xml
              subPath: core-site.xml
            - name: spark-config
              mountPath: /opt/spark/conf/hdfs-site.xml
              subPath: hdfs-site.xml
            {{- if .Values.metrics.enabled }}
            - name: spark-config
              mountPath: /opt/spark/conf/metrics.properties
              subPath: metrics.properties
            {{- end }}

      volumes:
        - name: spark-config
          configMap:
            name: {{ include "spark.fullname" . }}-config
