apiVersion: v1
kind: Service

metadata:
  name: {{ include "spark.fullname" . }}-worker
  labels:
    {{- include "spark.labels" . | nindent 4 }}
    component: worker

spec:
  type: {{ .Values.service.worker.type }}
  {{- if .Values.service.worker.headless }}
  clusterIP: None
  {{- end }}

  ports:
    - name: worker-ui
      port: {{ .Values.service.worker.uiPort }}
      targetPort: {{ .Values.service.worker.uiPort }}
      protocol: TCP

  selector:
    {{- include "spark.selectorLabels" . | nindent 4 }}
    component: worker
