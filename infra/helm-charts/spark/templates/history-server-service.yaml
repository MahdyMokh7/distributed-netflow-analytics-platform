apiVersion: v1
kind: Service

metadata:
  name: {{ include "spark.fullname" . }}-history-server
  labels:
    {{- include "spark.labels" . | nindent 4 }}
    component: history-server

spec:
  type: {{ .Values.service.historyServer.type }}

  ports:
    - name: web-ui
      port: {{ .Values.service.historyServer.port }}
      targetPort: {{ .Values.service.historyServer.port }}
      protocol: TCP

  selector:
    {{- include "spark.selectorLabels" . | nindent 4 }}
    component: history-server
