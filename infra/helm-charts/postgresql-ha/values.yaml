replicaCount: 3

image:

  patroni: "zoraq.inside.sahab.ir:9462/nimbo-postgres-patroni:18-patroni3.3.6"
  postgresExporter: "prometheuscommunity/postgres-exporter:v0.15.0"
  pullPolicy: IfNotPresent

auth:
  existingSecret: postgresql-auth
  superuserPassword: "DUMMY"
  replicationPassword: "DUMMY"
  rewindPassword: "DUMMY"

appDatabase:
  databaseName: "nimbo_db"
  existingSecretName: "batch-processor-secret"
  usernameKey: "DB_USERNAME"
  passwordKey: "DB_PASSWORD"

storage:
  className: "disk1"
  size: "150Gi"

resources:
  postgresql:
    requests:
      cpu: "250m"
      memory: "512Mi"
  exporter:
    requests:
      cpu: "50m"
      memory: "64Mi"

service:
  masterLoadBalancerIP: ""
  metallbPoolName: "default"

metrics:
  exporterPort: 9187
