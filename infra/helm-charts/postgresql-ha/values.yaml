replicaCount: 3

image:

  patroni: "zoraq.inside.sahab.ir:9462/nimbo-postgres-patroni:18-patroni3.3.6"
  postgresExporter: "prometheuscommunity/postgres-exporter:v0.15.0"
  pullPolicy: IfNotPresent

auth:
  existingSecret: postgresql-auth
  superuserPassword: "DUMMY"
  replicationPassword: "DUMMY"
  rewindPassword: "DUMMY"

appDatabase:
  databaseName: "nimbo_db"
  existingSecretName: "batch-processor-secret"
  usernameKey: "DB_USERNAME"
  passwordKey: "DB_PASSWORD"

storage:
  className: "disk1"
  size: "150Gi"

postgresql:
  parameters:
    maxConnections: 100
    sharedBuffers: 512MB
    effectiveCacheSize: 3GB
    maxWalSize: 2GB
    checkpointTimeout: 15min
    checkpointCompletionTarget: 0.9
    walCompression: "on"

resources:
  postgresql:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"
  exporter:
    requests:
      cpu: "50m"
      memory: "64Mi"

service:
  masterLoadBalancerIP: "10.10.61.70"
  metallbPoolName: "default"

metrics:
  exporterPort: 9187
