apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
data:
  patroni.yml: |
    scope: postgresql

    bootstrap:
      dcs:
        postgresql:
          use_pg_rewind: true
          pg_hba:
            - local all postgres trust
            - host all all 0.0.0.0/0 md5
            - host replication replication 0.0.0.0/0 md5
          parameters:
            max_connections: 100
            max_worker_processes: 8

      initdb:
        - auth-host: md5
        - auth-local: trust
        - encoding: UTF8
        - data-checksums

    restapi:
      listen: 0.0.0.0:8000

    postgresql:
      listen: 0.0.0.0:5432
      authentication:
        superuser:
          username: postgres
        replication:
          username: replication
        rewind:
          username: rewind
      data_dir: /var/lib/postgresql/data/pgdata
      pgpass: /tmp/pgpass
      parameters:
        log_destination: jsonlog
        logging_collector: on
        log_statement: all
        log_directory: /var/log/postgresql
        log_filename: log
        log_rotation_age: 0
        log_rotation_size: 0
        effective_cache_size: 4GB
        effective_io_concurrency: 1
        max_parallel_maintenance_workers: 2
        max_parallel_workers: 8
        max_parallel_workers_per_gather: 2
        max_wal_size: 1GB
        min_wal_size: 80MB
        reserved_connections: 0
        shared_buffers: 128MB
        shared_preload_libraries: null
        superuser_reserved_connections: 3
        wal_buffers: 16MB
        wal_compression: "on"
        work_mem: 4MB

    kubernetes:
      use_endpoints: true
      labels:
        app: postgresql
        cluster-name: postgresql

    log:
      type: json
      format:
        - asctime: timestamp
        - message
        - levelname: level
        - module
        - filename: file
        - lineno: line_number
      dateformat: "%Y-%m-%d %H:%M:%S.%03d %z"
      static_fields:
        app: patroni
