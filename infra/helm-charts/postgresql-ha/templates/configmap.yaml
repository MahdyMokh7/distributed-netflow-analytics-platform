apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
data:
  patroni.yml: |
    scope: postgresql

    bootstrap:
      dcs:
        postgresql:
          use_pg_rewind: true
          pg_hba:
            - local all postgres trust
            - host all all 0.0.0.0/0 md5
            - host replication replication 0.0.0.0/0 md5
          parameters:
            max_connections: 100
            max_worker_processes: 8

      initdb:
        - auth-host: md5
        - auth-local: trust
        - encoding: UTF8
        - data-checksums

    restapi:
      listen: 0.0.0.0:8000

    postgresql:
      listen: 0.0.0.0:5432
      authentication:
        superuser:
          username: postgres
        replication:
          username: replication
        rewind:
          username: rewind
      data_dir: /var/lib/postgresql/data/pgdata
      pgpass: /tmp/pgpass
      parameters:
        log_destination: jsonlog
        effective_cache_size: 4GB
        shared_buffers: 128MB
        wal_compression: "on"

    kubernetes:
      use_endpoints: true
      labels:
        app: postgresql
        cluster-name: postgresql