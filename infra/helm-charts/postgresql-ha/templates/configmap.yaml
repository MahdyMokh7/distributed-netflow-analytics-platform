apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
data:
  patroni.yml: |
    scope: postgresql

    bootstrap:
      dcs:
        postgresql:
          use_pg_rewind: true
          pg_hba:
            - local all postgres trust
            - host all all 0.0.0.0/0 md5
            - host replication replication 0.0.0.0/0 md5
          parameters:
            max_connections: {{ .Values.postgresql.parameters.maxConnections }}
            max_worker_processes: 8
            shared_buffers: {{ .Values.postgresql.parameters.sharedBuffers }}
            effective_cache_size: {{ .Values.postgresql.parameters.effectiveCacheSize }}
            max_wal_size: {{ .Values.postgresql.parameters.maxWalSize }}
            checkpoint_timeout: {{ .Values.postgresql.parameters.checkpointTimeout }}
            checkpoint_completion_target: {{ .Values.postgresql.parameters.checkpointCompletionTarget }}
            wal_compression: {{ .Values.postgresql.parameters.walCompression | quote }}

      initdb:
        - auth-host: md5
        - auth-local: trust
        - encoding: UTF8
        - data-checksums

    restapi:
      listen: 0.0.0.0:8000

    postgresql:
      listen: 0.0.0.0:5432
      authentication:
        superuser:
          username: postgres
        replication:
          username: replication
        rewind:
          username: rewind
      data_dir: /var/lib/postgresql/data/pgdata
      pgpass: /tmp/pgpass
      parameters:
        log_destination: jsonlog
        max_connections: {{ .Values.postgresql.parameters.maxConnections }}
        shared_buffers: {{ .Values.postgresql.parameters.sharedBuffers }}
        effective_cache_size: {{ .Values.postgresql.parameters.effectiveCacheSize }}
        max_wal_size: {{ .Values.postgresql.parameters.maxWalSize }}
        checkpoint_timeout: {{ .Values.postgresql.parameters.checkpointTimeout }}
        checkpoint_completion_target: {{ .Values.postgresql.parameters.checkpointCompletionTarget }}
        wal_compression: {{ .Values.postgresql.parameters.walCompression | quote }}

    kubernetes:
      use_endpoints: true
      labels:
        app: postgresql
        cluster-name: postgresql
