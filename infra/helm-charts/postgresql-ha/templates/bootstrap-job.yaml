apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postgresql.fullname" . }}-bootstrap
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: "{{ .Values.image.patroni }}"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.authSecretName" . }}
                  key: superuser-password
            - name: APP_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appDatabase.existingSecretName | quote }}
                  key: {{ .Values.appDatabase.usernameKey | quote }}
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appDatabase.existingSecretName | quote }}
                  key: {{ .Values.appDatabase.passwordKey | quote }}
            - name: ANALYTICS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.analyticsDatabase.existingSecretName | quote }}
                  key: {{ .Values.analyticsDatabase.usernameKey | quote }}
            - name: ANALYTICS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.analyticsDatabase.existingSecretName | quote }}
                  key: {{ .Values.analyticsDatabase.passwordKey | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              psql -h {{ include "postgresql.fullname" . }}-master -U postgres \
                --set=ON_ERROR_STOP=1 \
                --set=app_db_user="${APP_DB_USER}" \
                --set=app_db_password="${APP_DB_PASSWORD}" \
                --set=analytics_db_user="${ANALYTICS_DB_USER}" \
                --set=analytics_db_password="${ANALYTICS_DB_PASSWORD}" \
                --set=analytics_reader_role={{ .Values.analyticsDatabase.readerRole | quote }} <<'SQL'
              SELECT format('CREATE DATABASE %I', '{{ .Values.appDatabase.databaseName }}')
              WHERE NOT EXISTS (
                SELECT FROM pg_database
                WHERE datname = '{{ .Values.appDatabase.databaseName }}'
              )\gexec

              SELECT format('CREATE ROLE %I LOGIN', :'app_db_user')
              WHERE NOT EXISTS (
                SELECT FROM pg_roles
                WHERE rolname = :'app_db_user'
              )\gexec
              SELECT format(
                'ALTER ROLE %I LOGIN PASSWORD %L',
                :'app_db_user',
                :'app_db_password'
              )\gexec

              SELECT format('CREATE ROLE %I NOLOGIN', :'analytics_reader_role')
              WHERE NOT EXISTS (
                SELECT FROM pg_roles
                WHERE rolname = :'analytics_reader_role'
              )\gexec
              SELECT format('ALTER ROLE %I NOLOGIN', :'analytics_reader_role')\gexec

              SELECT format('CREATE ROLE %I LOGIN INHERIT', :'analytics_db_user')
              WHERE NOT EXISTS (
                SELECT FROM pg_roles
                WHERE rolname = :'analytics_db_user'
              )\gexec
              SELECT format(
                'ALTER ROLE %I LOGIN INHERIT PASSWORD %L',
                :'analytics_db_user',
                :'analytics_db_password'
              )\gexec

              SELECT format(
                'GRANT ALL PRIVILEGES ON DATABASE %I TO %I',
                '{{ .Values.appDatabase.databaseName }}',
                :'app_db_user'
              )\gexec
              SELECT format(
                'GRANT CONNECT ON DATABASE %I TO %I',
                '{{ .Values.appDatabase.databaseName }}',
                :'analytics_reader_role'
              )\gexec
              SELECT format(
                'GRANT %I TO %I',
                :'analytics_reader_role',
                :'analytics_db_user'
              )\gexec

              \connect {{ .Values.appDatabase.databaseName }}
              SELECT format(
                'GRANT USAGE, CREATE ON SCHEMA public TO %I',
                :'app_db_user'
              )\gexec
              SELECT format(
                'GRANT USAGE ON SCHEMA public TO %I',
                :'analytics_reader_role'
              )\gexec
              SQL
