apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.fullname" . }}-auth
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  superuser-password: {{ .Values.auth.superuserPassword | quote }}
  replication-password: {{ .Values.auth.replicationPassword | quote }}
  rewind-password: {{ .Values.auth.rewindPassword | quote }}
