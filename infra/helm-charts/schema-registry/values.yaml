replicaCount: 1

image:
  repository: zoraq.inside.sahab.ir:9462/zoraq/confluent-schema-registry
  tag: "8.0.2"
  pullPolicy: IfNotPresent

containerPort: 8081

terminationGracePeriodSeconds: 30

service:
  type: LoadBalancer
  port: 8081
  annotations: {}
  loadBalancerIP: ""
  loadBalancerSourceRanges: []

config:
  SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://10.10.61.51:9092,PLAINTEXT://10.10.61.53:9092,PLAINTEXT://10.10.61.54:9092"
  SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: "PLAINTEXT"
  SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
  SCHEMA_REGISTRY_KAFKASTORE_TOPIC: "_schemas_nimbyte"
  SCHEMA_REGISTRY_SCHEMA_REGISTRY_GROUP_ID: "schema-registry-nimbyte"
  SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "3"
  SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: "BACKWARD"
  SCHEMA_REGISTRY_HEAP_OPTS: "-Xms256m -Xmx256m"

extraEnv: []
probes:
  startup:
    path: /
    timeoutSeconds: 3
    failureThreshold: 30
    periodSeconds: 5
  readiness:
    path: /subjects
    timeoutSeconds: 3
    failureThreshold: 6
    periodSeconds: 10
  liveness:
    path: /
    timeoutSeconds: 3
    failureThreshold: 6
    periodSeconds: 20

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
