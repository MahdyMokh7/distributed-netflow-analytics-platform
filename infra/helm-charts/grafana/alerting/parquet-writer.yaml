apiVersion: 1
groups:
  - orgId: 1
    name: Parquet Writer
    folder: Nimbyte
    interval: 1m

    rules:
      - uid: cfxtfb1qs7m68a
        title: Parquet Writer Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 1 - max(up{job="parquet-writer"}) or vector(1)
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          description: Parquet Writer has no scrape target or its metrics endpoint has been unreachable for 5 minutes.
          summary: Parquet Writer metrics endpoint is unavailable
        labels:
          module: parquet-writer
          service: parquet-writer
          severity: critical
        isPaused: false
      - uid: afxtfrdoobw8we
        title: Parquet Writer Kafka Lag Risks Retention
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                sum by (client_id, topic) (
                  max by (client_id, topic, partition) (
                    kafka_consumer_fetch_manager_records_lag{
                      job="parquet-writer",
                      topic="multi-version-netflow"
                    }
                  )
                )
                / on (client_id, topic)
                clamp_min(
                  max by (client_id, topic) (
                    avg_over_time(
                      kafka_consumer_fetch_manager_records_consumed_rate{
                        job="parquet-writer",
                        topic="multi-version-netflow"
                      }[15m]
                    )
                  ),
                  0.01
                )
              instant: true
              intervalMs: 1000
              legendFormat: '{{client_id}}'
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 172800
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          description: |-
            Estimated time to drain this consumer's assigned Kafka backlog has exceeded 48 hours for 15 minutes.
            The estimate is total assigned lag divided by the consumer's 15-minute average consumption rate; it is not event-time latency.
            Kafka retains this topic for 72 hours, so this leaves about 24 hours of recovery margin.
            
            Topic:
            {{ $labels.topic }}
            
            Consumer:
            {{ $labels.client_id }}
          summary: Parquet Writer Kafka backlog risks 72-hour retention for {{ $labels.client_id }}
        labels:
          module: parquet-writer
          service: kafka-consumer
          severity: critical
          topic: multi-version-netflow
        isPaused: false
