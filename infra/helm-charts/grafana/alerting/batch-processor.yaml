apiVersion: 1
groups:
  - orgId: 1
    name: Batch Processor
    folder: Nimbyte
    interval: 1m
    rules:
      - uid: nimbo-batch-processor-down
        title: BatchProcessorDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 1 - max(up{job="batch-processor"}) or vector(1)
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              refId: C
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: Alerting
        execErrState: Error
        for: 10m
        labels: {module: batch-processor, severity: critical}
        annotations:
          summary: Batch processor metrics endpoint is unavailable
          description: Prometheus has no batch processor target or has been unable to scrape it for ten minutes.

      - uid: nimbo-batch-processor-run-failed
        title: BatchProcessorRunFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 7800, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(increase(batch_processor_runs_total{job="batch-processor",outcome="failed"}[130m])) + max(min_over_time(batch_processor_failed_batch_pending{job="batch-processor"}[70m]))
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              refId: C
              conditions:
                - evaluator: {params: [1.5], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 0s
        labels: {module: batch-processor, severity: critical}
        annotations:
          summary: Batch processor run failed
          description: Two runs failed within two hourly schedules, or one failed batch remained pending through its next retry interval.

      - uid: nimbo-batch-processor-run-stuck
        title: BatchProcessorRunStuck
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: max without (pod, instance) (batch_processor_run_in_progress{job="batch-processor"})
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              refId: C
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 70m
        labels: {module: batch-processor, severity: critical}
        annotations:
          summary: Batch processor run is taking too long
          description: A batch processor run has remained active for more than seventy minutes and has exceeded the next hourly schedule.

      - uid: nimbo-batch-processor-state-fallback
        title: BatchProcessorStateFallbackActive
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: max without (pod, instance) (batch_processor_state_fallback_active{job="batch-processor"})
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              refId: C
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 10m
        labels: {module: batch-processor, severity: critical}
        annotations:
          summary: Batch processor state is not durable
          description: Processed-file state exists only in memory; a pod restart can cause files to be processed again.
