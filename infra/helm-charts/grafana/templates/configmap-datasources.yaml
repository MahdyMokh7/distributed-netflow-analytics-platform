apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: {{ .Values.prometheus.url }}
        uid: {{ .Values.prometheus.datasourceUid }}
        isDefault: true
        editable: false
      {{- if .Values.starrocks.enabled }}
      - name: StarRocks
        type: mysql
        access: proxy
        url: {{ printf "%s:%v" .Values.starrocks.host .Values.starrocks.port | quote }}
        database: {{ .Values.starrocks.database | quote }}
        uid: {{ .Values.starrocks.datasourceUid | quote }}
        user: $GRAFANA_STARROCKS_USER
        secureJsonData:
          password: $GRAFANA_STARROCKS_PASSWORD
        isDefault: false
        editable: false
      {{- end }}
