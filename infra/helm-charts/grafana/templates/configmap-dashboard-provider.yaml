apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-dashboard-provider
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: nimbo-dashboards
        orgId: 1
        folder: 'Nimbyte'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
