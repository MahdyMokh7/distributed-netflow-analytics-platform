---
- name: Check if Java exists
  ansible.builtin.command: java -version
  register: java_check
  changed_when: false
  failed_when: false

- name: Install Java if missing
  ansible.builtin.apt:
    name: openjdk-21-jre-headless
    state: present
    update_cache: true
  when: java_check.rc != 0

- name: Verify Java installation
  ansible.builtin.command: java -version
  register: java_verify
  changed_when: false
  failed_when: java_verify.rc != 0