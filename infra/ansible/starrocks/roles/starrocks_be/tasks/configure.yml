---
- name: Install initial backend configuration only when missing
  ansible.builtin.template:
    src: be.conf.j2
    dest: "{{ starrocks_install_dir }}/be/conf/be.conf"
    owner: root
    group: "{{ starrocks_group }}"
    mode: '0640'
    force: false

- name: Install managed backend configuration on an uninitialized node
  ansible.builtin.template:
    src: be.conf.j2
    dest: "{{ starrocks_install_dir }}/be/conf/be.conf"
    owner: root
    group: "{{ starrocks_group }}"
    mode: '0640'
  when: not starrocks_disk.has_metadata and not starrocks_disk.has_be_data

- name: Install the backend HDFS HA client configuration
  ansible.builtin.template:
    src: hdfs-site.xml.j2
    dest: "{{ starrocks_install_dir }}/be/conf/hdfs-site.xml"
    owner: root
    group: "{{ starrocks_group }}"
    mode: '0640'
  register: starrocks_be_hdfs_site

- name: Install the backend service unit
  ansible.builtin.template:
    src: starrocks-be.service.j2
    dest: /etc/systemd/system/starrocks-be.service
    owner: root
    group: root
    mode: '0644'
  register: starrocks_be_unit

- name: Record whether the backend needs a rolling restart
  ansible.builtin.set_fact:
    starrocks_be_restart_required: >-
      {{ (starrocks_be_unit.changed | bool) or (starrocks_be_hdfs_site.changed | bool) }}

- name: Ensure the BE installation tree is owned by the service account
  ansible.builtin.file:
    path: "{{ starrocks_link }}/be"
    owner: "{{ starrocks_user }}"
    group: "{{ starrocks_group }}"
    recurse: true
