---
- name: Recover previously initialized frontends together
  ansible.builtin.systemd_service:
    name: starrocks-fe
    state: started
    enabled: true
    daemon_reload: true
  when:
    - starrocks_disk.has_metadata

- name: Bootstrap one frontend on an empty cluster
  ansible.builtin.include_tasks: bootstrap.yml
  when:
    - inventory_hostname == starrocks_bootstrap_host
    - not (starrocks_fe_metadata_present | bool)
