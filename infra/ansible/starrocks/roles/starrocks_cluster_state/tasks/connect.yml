---
- name: Authenticate to the live cluster
  ansible.builtin.command:
    argv:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        for host in {{ starrocks_connection.login_hosts | map('quote') | join(' ') }}; do
          for pw_name in vault empty; do
            case "$pw_name" in
              vault) pw="$SR_PW_VAULT" ;;
              empty) pw="" ;;
            esac

            if [ "$pw_name" = "empty" ] && [ "$host" != "$SR_BOOTSTRAP_ADDRESS" ]; then
              continue
            fi

            if err=$(MYSQL_PWD="$pw" mysql \
                --connect-timeout=3 \
                -h "$host" \
                -P "{{ starrocks_connection.login_port }}" \
                -u root \
                -e "SELECT 1" 2>&1 >/dev/null); then
              printf 'host=%s\npw=%s\n' "$host" "$pw_name"
              exit 0
            fi

            case "$err" in
              *"Access denied"*) : ;;
              *) break ;;
            esac
          done
        done

        echo "No authenticated FE is reachable among the candidate hosts"
        exit 1

  environment:
    SR_PW_VAULT: "{{ starrocks_connection.login_password }}"
    SR_BOOTSTRAP_ADDRESS: "{{ hostvars[starrocks_bootstrap_host].starrocks_address }}"

  register: starrocks_connect
  changed_when: false
  check_mode: false
  no_log: true

- name: Record the cluster connection details
  ansible.builtin.set_fact:
    starrocks_sql_host: "{{ starrocks_connect.stdout_lines[0] | regex_replace('^host=', '') | trim }}"
    starrocks_sql_pw_idx: "{{ starrocks_connect.stdout_lines[1] | regex_replace('^pw=', '') | trim }}"
  no_log: true

- name: Resolve the SQL password
  ansible.builtin.set_fact:
    starrocks_sql_pw: >-
      {{ {'vault': starrocks_connection.login_password,
          'empty': ''}[starrocks_sql_pw_idx | trim] }}
  no_log: true
