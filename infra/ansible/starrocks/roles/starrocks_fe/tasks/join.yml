---
- name: Read the live cluster state
  ansible.builtin.import_role:
    name: starrocks_cluster_state

- name: Write the one-time join helper for a fresh frontend
  ansible.builtin.copy:
    content: "{{ starrocks_leader_host | trim }}:{{ starrocks_leader_edit_log_port | int }}\n"
    dest: "{{ starrocks_fe_helper_file }}"
    owner: root
    group: "{{ starrocks_group }}"
    mode: '0640'
  when:
    - not starrocks_disk.has_metadata
    - not ansible_check_mode
    - (starrocks_leader_host | default('') | length) > 0

- name: Register the fresh frontend with the cluster
  ansible.builtin.command:
    argv:
      - mysql
      - --connect-timeout=3
      - "-h{{ starrocks_sql_host }}"
      - "-P{{ starrocks_connection.login_port }}"
      - "-uroot"
      - -e
      - >-
        ALTER SYSTEM ADD
        {{ 'FOLLOWER' if inventory_hostname in groups['starrocks_fe_voters'] else 'OBSERVER' }}
        '{{ starrocks_address }}:{{ starrocks_edit_log_port | int }}'
  environment:
    MYSQL_PWD: "{{ starrocks_sql_pw }}"
  changed_when: true
  check_mode: false
  no_log: true
  when:
    - not starrocks_disk.has_metadata
    - not ansible_check_mode
    - (starrocks_fe_rows | selectattr('Host', 'equalto', starrocks_address) | list | length) == 0

- name: Start a fresh frontend using its join helper
  ansible.builtin.systemd_service:
    name: starrocks-fe
    state: started
    enabled: true
    daemon_reload: true
  when: not starrocks_disk.has_metadata

- name: Wait for the fresh frontend to become healthy
  ansible.builtin.uri:
    url: "http://{{ starrocks_address }}:{{ starrocks_http_port }}/api/health"
    method: GET
    status_code: 200
  register: starrocks_fe_health
  until: starrocks_fe_health.status == 200
  retries: "{{ starrocks_health_retries | int }}"
  delay: "{{ starrocks_health_delay | int }}"
  when:
    - not starrocks_disk.has_metadata
    - not ansible_check_mode

- name: Remove the one-time join helper
  ansible.builtin.file:
    path: "{{ starrocks_fe_helper_file }}"
    state: absent
  when:
    - not starrocks_disk.has_metadata
    - not ansible_check_mode

- name: Guard the rolling frontend restart
  ansible.builtin.assert:
    that: >-
      (starrocks_fe_rows | selectattr('Role', 'in', ['LEADER', 'FOLLOWER']) | list | length) <= 1
      or (starrocks_fe_rows | selectattr('Role', 'in', ['LEADER', 'FOLLOWER'])
          | rejectattr('Host', 'equalto', starrocks_address)
          | selectattr('Alive', 'equalto', 'true') | list | length)
      >= ((starrocks_fe_rows | selectattr('Role', 'in', ['LEADER', 'FOLLOWER']) | list | length) // 2 + 1)
    fail_msg: Restart would lose the FE quorum; recover peer availability first
  when:
    - starrocks_fe_unit_changed | default(false) | bool
    - starrocks_disk.has_metadata
    - not ansible_check_mode

- name: Restart the frontend after its unit changed
  ansible.builtin.systemd_service:
    name: starrocks-fe
    state: restarted
    daemon_reload: true
  when:
    - starrocks_fe_unit_changed | default(false) | bool
    - starrocks_disk.has_metadata
    - not ansible_check_mode

- name: Clear the frontend unit change record
  ansible.builtin.set_fact:
    starrocks_fe_unit_changed: false

- name: Verify the frontend is alive in the cluster
  ansible.builtin.command:
    argv:
      - bash
      - -c
      - |
        MYSQL_PWD="$SR_PW" mysql \
          --batch \
          --skip-column-names \
          -h "{{ starrocks_sql_host }}" \
          -P "{{ starrocks_connection.login_port }}" \
          -u root \
          -e "SHOW FRONTENDS" |
        awk -F '\t' '$2 ~ "{{ starrocks_address }}" && $10 == "true" {print "true"}'
  environment:
    SR_PW: "{{ starrocks_sql_pw }}"
  register: starrocks_fe_ready
  until: starrocks_fe_ready.stdout | trim == "true"
  retries: 150
  delay: 2
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - not ansible_check_mode
    - starrocks_disk.has_metadata | bool
