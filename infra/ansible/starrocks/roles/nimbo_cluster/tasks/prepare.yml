---
- name: Verify Java runtime exists
  ansible.builtin.command:
    cmd: java --version
  register: starrocks_java_check
  changed_when: false
  failed_when: starrocks_java_check.rc != 0

- name: Verify MySQL client exists
  ansible.builtin.command:
    cmd: mysql --version
  register: starrocks_mysql_check
  changed_when: false
  failed_when: starrocks_mysql_check.rc != 0


- name: Create the service group
  ansible.builtin.group:
    name: "{{ starrocks_group }}"
    system: true


- name: Create the locked service account
  ansible.builtin.user:
    name: "{{ starrocks_user }}"
    group: "{{ starrocks_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    password_lock: true

- name: Create persistent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ starrocks_user }}"
    group: "{{ starrocks_group }}"
    mode: '0750'
  loop:
    - "{{ starrocks_meta_dir }}"
    - "{{ starrocks_storage_dir }}"
    - "{{ starrocks_log_dir }}"
    - "{{ starrocks_log_dir }}/fe"
    - "{{ starrocks_log_dir }}/be"
  no_log: true

- name: Ensure preserved files are owned by the service account
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    recurse: true
    owner: "{{ starrocks_user }}"
    group: "{{ starrocks_group }}"
  loop:
    - "{{ starrocks_meta_dir }}"
    - "{{ starrocks_storage_dir }}"

- name: Create artifact cache
  ansible.builtin.file:
    path: "{{ starrocks_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Fetch the pinned release
  ansible.builtin.get_url:
    url: "{{ starrocks_archive_url }}"
    dest: "{{ starrocks_cache_dir }}/StarRocks-{{ starrocks_version }}.tar.gz"
    owner: root
    group: root
    mode: '0644'
    timeout: 600

- name: Extract the release once
  ansible.builtin.unarchive:
    src: "{{ starrocks_cache_dir }}/StarRocks-{{ starrocks_version }}.tar.gz"
    dest: /opt
    remote_src: true
    owner: root
    group: root
    creates: "{{ starrocks_install_dir }}/.ansible-extracted"

- name: Prepare StarRocks writable directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ starrocks_user }}"
    group: "{{ starrocks_group }}"
    mode: '0750'
  loop:
    - "{{ starrocks_install_dir }}/fe/plugins"
    - "{{ starrocks_meta_dir }}"
    - "{{ starrocks_storage_dir }}"
    - "{{ starrocks_log_dir }}/fe"
    - "{{ starrocks_log_dir }}/be"


- name: Hand StarRocks installation to service account
  ansible.builtin.file:
    path: "{{ starrocks_install_dir }}"
    owner: "{{ starrocks_user }}"
    group: "{{ starrocks_group }}"

- name: Record successful extraction
  ansible.builtin.copy:
    content: "{{ starrocks_archive_url }}\n"
    dest: "{{ starrocks_install_dir }}/.ansible-extracted"
    owner: root
    group: root
    mode: '0644'

- name: Link the active release
  file:
    src: "{{ starrocks_install_dir }}"
    dest: "{{ starrocks_link }}"
    state: link

- name: Create the application configuration directory
  ansible.builtin.file:
    path: /etc/starrocks
    state: directory
    owner: root
    group: "{{ starrocks_group }}"
    mode: '0750'


- name: Install initial configuration only when missing
  ansible.builtin.template:
    src: "{{ item }}.conf.j2"
    dest: "{{ starrocks_install_dir }}/{{ item }}/conf/{{ item }}.conf"
    owner: root
    group: "{{ starrocks_group }}"
    mode: '0640'
    force: false
  loop: [fe, be]

- name: Install initial managed configuration for an uninitialized node
  ansible.builtin.template:
    src: "{{ item }}.conf.j2"
    dest: "{{ starrocks_install_dir }}/{{ item }}/conf/{{ item }}.conf"
    owner: root
    group: "{{ starrocks_group }}"
    mode: '0640'
  loop: [fe, be]
  when: not starrocks_disk.has_metadata and not starrocks_disk.has_be_data

- name: Configure persistent kernel limits
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-nimbo-starrocks.conf
    sysctl_set: true
    reload: true
  loop:
    - {key: vm.max_map_count, value: '262144'}
    - {key: vm.swappiness, value: '0'}
    - {key: vm.overcommit_memory, value: '1'}

- name: Disable configured swap persistently
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\s]+\s+\S+\s+swap\s+.*)$'
    replace: '# Disabled for Nimbo StarRocks: \1'

- name: Disable active swap
  ansible.builtin.command: /sbin/swapoff -a
  when: ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: Install service-specific login limits
  ansible.builtin.template:
    src: limits.conf.j2
    dest: /etc/security/limits.d/90-nimbo-starrocks.conf
    owner: root
    group: root
    mode: '0644'

- name: Install the time synchronization service
  ansible.builtin.package:
    name: "{{ starrocks_chrony_package }}"
    state: present

- name: Disable the conflicting systemd time client
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  failed_when: false

- name: Install the managed time synchronization configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ starrocks_chrony_conf }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart StarRocks time synchronization

- name: Enable the time synchronization service
  ansible.builtin.systemd_service:
    name: "{{ starrocks_chrony_service }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Apply time configuration before checking readiness
  ansible.builtin.meta: flush_handlers

- name: Wait for the clock to synchronize
  ansible.builtin.command:
    argv:
      - bash
      - -o
      - pipefail
      - -c
      - |
        {% if not starrocks_ntp_servers %}
        if chronyc -n sources | awk '
          /^MS / { header = 1; next }
          header && /^=+$/ { start = 1; next }
          start && NF >= 5 && ($5 + 0) > 0 { ok = 1 }
          END { exit !ok }
        '; then
          exit 0
        fi
        {% endif %}

        chronyc waitsync {{ starrocks_clock_sync_tries | int }} {{ starrocks_max_clock_correction }}
  register: starrocks_clock_sync
  changed_when: false
  check_mode: false


- name: Install persistent THP configuration
  ansible.builtin.template:
    src: thp.service.j2
    dest: /etc/systemd/system/starrocks-thp.service
    owner: root
    group: root
    mode: '0644'

- name: Apply THP configuration
  ansible.builtin.systemd_service:
    name: starrocks-thp
    enabled: true
    state: started
    daemon_reload: true

- name: Create service launcher directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the frontend launcher
  ansible.builtin.template:
    src: start-fe.sh.j2
    dest: /usr/local/libexec/nimbo-starrocks-fe
    owner: root
    group: root
    mode: '0755'
    validate: /bin/bash -n %s
  register: starrocks_fe_launcher

- name: Install FE service
  ansible.builtin.template:
    src: starrocks.service.j2
    dest: /etc/systemd/system/starrocks-fe.service
    owner: root
    group: root
    mode: '0644'
  vars:
    starrocks_component: fe
  register: starrocks_fe_unit
  when: inventory_hostname in groups['starrocks_fe']

- name: Install BE service
  ansible.builtin.template:
    src: starrocks.service.j2
    dest: /etc/systemd/system/starrocks-be.service
    owner: root
    group: root
    mode: '0644'
  vars:
    starrocks_component: be
  register: starrocks_be_unit
  when: inventory_hostname in groups['starrocks_be']

- name: Record frontend unit change for the rolling restart
  ansible.builtin.set_fact:
    starrocks_fe_unit_changed: "{{ starrocks_fe_unit.changed | bool }}"
  when: inventory_hostname in groups['starrocks_fe']

- name: Record backend unit change for the rolling restart
  ansible.builtin.set_fact:
    starrocks_be_unit_changed: "{{ starrocks_be_unit.changed | bool }}"
  when: inventory_hostname in groups['starrocks_be']
