---
- name: Collect all disk identities
  ansible.builtin.set_fact:
    starrocks_disks: "{{ dict(groups['starrocks'] | zip(groups['starrocks'] | map('extract', hostvars, 'starrocks_disk'))) }}"

- name: Record the cross-host cluster state
  ansible.builtin.set_fact:
    starrocks_cluster_ids: >-
      {{
        starrocks_disks
        | dict2items
        | selectattr('value.has_metadata', 'equalto', true)
        | map(attribute='value.cluster_id')
        | unique
        | sort
        | list
      }}

    starrocks_hosts_with_be_data: >-
      {{
        starrocks_disks
        | dict2items
        | selectattr('value.has_be_data', 'equalto', true)
        | map(attribute='key')
        | list
      }}

    starrocks_conflicting_role_host: >-
      {{
        (
          (
            starrocks_disks
            | dict2items
            | selectattr('value.has_metadata', 'equalto', true)
            | selectattr('key', 'in', groups['starrocks_fe_voters'])
            | rejectattr('value.node_role', 'equalto', 'FOLLOWER')
            | map(attribute='key')
            | list
          )
          +
          (
            starrocks_disks
            | dict2items
            | selectattr('value.has_metadata', 'equalto', true)
            | selectattr('key', 'in', groups['starrocks_fe_observers'] | default([]))
            | rejectattr('value.node_role', 'equalto', 'OBSERVER')
            | map(attribute='key')
            | list
          )
          +
          ['']
        )
        | first
      }}

- name: Validate the whole cluster before changing any host
  ansible.builtin.assert:
    that:
      - (starrocks_cluster_ids | length) <= 1
      - (starrocks_cluster_ids | length) > 0 or (starrocks_hosts_with_be_data | length) == 0
      - (starrocks_cluster_ids | length) == 0 or (starrocks_disks[starrocks_bootstrap_host]['has_metadata'] | bool)
      - >-
        (starrocks_cluster_ids | length) == 0
        or (starrocks_disks | dict2items | selectattr('key', 'in', groups['starrocks_fe_voters'])
            | map(attribute='value') | selectattr('has_metadata', 'equalto', true)
            | list | length) > 0
      - (starrocks_conflicting_role_host | length) == 0
    fail_msg: >-
      {{ 'Conflicting FE cluster IDs; no host may be changed'
         if (starrocks_cluster_ids | length) > 1
         else ('BE data exists without FE metadata; restore FE metadata before deployment'
               if (starrocks_cluster_ids | length) == 0 and (starrocks_hosts_with_be_data | length) > 0
               else ('Bootstrap FE metadata is missing; select a surviving voting FE as bootstrap_host'
                     if (starrocks_cluster_ids | length) > 0 and not (starrocks_disks[starrocks_bootstrap_host]['has_metadata'] | bool)
                     else ('No voting FE metadata survives'
                           if (starrocks_cluster_ids | length) > 0
                              and (starrocks_disks | dict2items | selectattr('key', 'in', groups['starrocks_fe_voters'])
                                   | map(attribute='value') | selectattr('has_metadata', 'equalto', true)
                                   | list | length) == 0
                           else 'Existing FE role on ' ~ (starrocks_conflicting_role_host | string)
                           ~ ' conflicts with inventory; explicit migration required'))) }}
