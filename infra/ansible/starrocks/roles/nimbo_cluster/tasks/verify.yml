---
- name: Import SQL topology context
  ansible.builtin.import_tasks: context.yml

- name: Determine whether the cluster has frontend metadata
  ansible.builtin.set_fact:
    starrocks_fe_metadata_present: >-
      {{ groups['starrocks_fe'] | map('extract', hostvars, 'starrocks_disk')
         | selectattr('has_metadata') | list | length > 0 }}

- name: Set the services this host must run
  ansible.builtin.set_fact:
    starrocks_expected_services: >-
      {{ ([starrocks_chrony_service]
          + (['starrocks-fe'] if inventory_hostname in groups['starrocks_fe'] else [])
          + (['starrocks-be'] if inventory_hostname in groups['starrocks_be'] else [])) }}

- name: Read service state
  ansible.builtin.service_facts:
  when: not ansible_check_mode or starrocks_fe_metadata_present

- name: Assert the required services are running
  ansible.builtin.assert:
    that:
      - >-
        (item == 'starrocks-thp' and
         (sr_svc.state | default('')) in ['running', 'exited'])
        or
        (item != 'starrocks-thp' and
         (sr_svc.state | default('')) == 'running')
    fail_msg: "Service {{ item }} is not active"
  vars:
    sr_svc: >-
      {{ ansible_facts.services[item ~ '.service']
         | default(ansible_facts.services[item] | default({})) }}
  loop: "{{ starrocks_expected_services }}"
  when: not ansible_check_mode or starrocks_fe_metadata_present

- name: Enable the complete cluster state checks
  ansible.builtin.set_fact:
    starrocks_state_complete: true
  when: inventory_hostname == (groups['starrocks_fe_voters'] | first)

- name: Import the live cluster state
  ansible.builtin.import_tasks: cluster_state.yml
  when:
    - inventory_hostname == (groups['starrocks_fe_voters'] | first)
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Define the managed application accounts
  ansible.builtin.set_fact:
    starrocks_accounts:
      - name: "{{ starrocks_writer }}"
        role: "{{ starrocks_writer }}_role"
        password: "{{ vault_starrocks_writer_password }}"
        database_privilege: "{{ starrocks_writer_database_privilege }}"
      - name: "{{ starrocks_reader }}"
        role: "{{ starrocks_reader }}_role"
        password: "{{ vault_starrocks_reader_password }}"
        database_privilege: ""
  no_log: true
  when:
    - inventory_hostname == (groups['starrocks_fe_voters'] | first)
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Probe the application account logins
  ansible.builtin.command:
    argv:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        err=$(MYSQL_PWD="$SR_ACPW" mysql --connect-timeout=3 -h "{{ starrocks_sql_host }}" -P "{{ starrocks_connection.login_port }}" -u "{{ item.name }}" -e "SELECT 1" 2>&1 >/dev/null) || true
        if [ -z "$err" ]; then
          echo ok
        else
          echo failed
        fi
  environment:
    SR_ACPW: "{{ item.password }}"
  register: starrocks_account_probe
  changed_when: false
  check_mode: false
  no_log: true
  loop: "{{ starrocks_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - inventory_hostname == (groups['starrocks_fe_voters'] | first)
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Require every application account to exist and authenticate
  ansible.builtin.assert:
    that: >-
      (starrocks_account_probe.results | default([]) | selectattr('stdout', 'defined')
       | map(attribute='stdout') | map('trim')
       | select('ne', 'ok') | list | length) == 0
    fail_msg: >-
      One or more application accounts do not exist, could not be reached,
      or failed to authenticate with the vault password
  when:
    - inventory_hostname == (groups['starrocks_fe_voters'] | first)
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Read the grants of each application role
  ansible.builtin.command:
    argv:
      - mysql
      - --connect-timeout=3
      - "-h{{ starrocks_sql_host }}"
      - "-P{{ starrocks_connection.login_port }}"
      - "-uroot"
      - -e
      - "SHOW GRANTS FOR ROLE `{{ item.role }}`"
  environment:
    MYSQL_PWD: "{{ starrocks_sql_pw }}"
  register: starrocks_role_grants_raw
  changed_when: false
  check_mode: false
  no_log: true
  loop: "{{ starrocks_accounts }}"
  loop_control:
    label: "{{ item.role }}"
  when:
    - inventory_hostname == (groups['starrocks_fe_voters'] | first)
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)
