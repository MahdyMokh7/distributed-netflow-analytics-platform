---
- name: Determine whether the cluster has frontend metadata
  ansible.builtin.set_fact:
    starrocks_fe_metadata_present: >-
      {{ groups['starrocks_fe'] | map('extract', hostvars, 'starrocks_disk')
         | selectattr('has_metadata') | list | length > 0 }}

- name: Authenticate to the live cluster
  ansible.builtin.command:
    argv:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        for host in {{ starrocks_connection.login_hosts | map('quote') | join(' ') }}; do
          for pw_name in vault prev empty; do
            case "$pw_name" in
              vault) pw="$SR_PW_VAULT" ;;
              prev) pw="$SR_PW_PREV" ;;
              empty) pw="" ;;
            esac

            if [ "$pw_name" = "prev" ] && { [ -z "$pw" ] || [ "$pw" = "$SR_PW_VAULT" ]; }; then
              continue
            fi

            if [ "$pw_name" = "empty" ] && [ "$host" != "$SR_BOOTSTRAP_ADDRESS" ]; then
              continue
            fi

            if err=$(MYSQL_PWD="$pw" mysql \
                --connect-timeout=3 \
                -h "$host" \
                -P "{{ starrocks_connection.login_port }}" \
                -u root \
                -e "SELECT 1" 2>&1 >/dev/null); then
              printf 'host=%s\npw=%s\n' "$host" "$pw_name"
              exit 0
            fi

            case "$err" in
              *"Access denied"*) : ;;
              *) break ;;
            esac
          done
        done

        echo "No authenticated FE is reachable among the candidate hosts"
        exit 1

  environment:
    SR_PW_VAULT: "{{ starrocks_connection.login_password }}"
    SR_PW_PREV: "{{ starrocks_connection.previous_password | default('') }}"
    SR_BOOTSTRAP_ADDRESS: "{{ hostvars[starrocks_bootstrap_host].starrocks_address }}"

  register: starrocks_connect
  changed_when: false
  check_mode: false
  no_log: true


- name: Record the cluster connection details
  ansible.builtin.set_fact:
    starrocks_sql_host: "{{ starrocks_connect.stdout_lines[0] | regex_replace('^host=', '') | trim }}"
    starrocks_sql_pw_idx: "{{ starrocks_connect.stdout_lines[1] | regex_replace('^pw=', '') | trim }}"
  no_log: true

- name: Resolve the SQL password
  ansible.builtin.set_fact:
    starrocks_sql_pw: >-
      {{ {'vault': starrocks_connection.login_password,
          'prev': starrocks_connection.previous_password | default(''),
          'empty': ''}[starrocks_sql_pw_idx | trim] }}
  no_log: true

- name: Read the live frontend membership
  ansible.builtin.command:
    argv:
      - mysql
      - --batch
      - --raw
      - --column-names
      - "--host={{ starrocks_sql_host }}"
      - "--port={{ starrocks_connection.login_port }}"
      - "--user=root"
      - -e
      - "SHOW FRONTENDS"
  environment:
    MYSQL_PWD: "{{ starrocks_sql_pw }}"
  register: starrocks_show_frontends
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Read the live backend membership
  ansible.builtin.command:
    argv:
      - mysql
      - --connect-timeout=3
      - "-h{{ starrocks_sql_host }}"
      - "-P{{ starrocks_connection.login_port }}"
      - "-uroot"
      - -B
      - --column-names
      - -e
      - "SHOW BACKENDS"
  environment:
    MYSQL_PWD: "{{ starrocks_sql_pw }}"
  register: starrocks_show_backends
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)


- name: Parse and normalize live cluster membership
  ansible.builtin.set_fact:
    starrocks_fe_rows: []
    starrocks_be_rows: []


- name: Build frontend dictionaries
  ansible.builtin.set_fact:
    starrocks_fe_rows: >-
      {{ starrocks_fe_rows
         + [sr_row | combine({'Host': sr_row.IP | default(sr_row.Host | default(''))})] }}
  vars:
    sr_tab: "\t"
    sr_row: >-
      {{ dict(starrocks_show_frontends.stdout_lines[0].split(sr_tab)
              | zip(item.split(sr_tab))) }}
  loop: "{{ (starrocks_show_frontends.stdout_lines | default([]))[1:] }}"
  loop_control:
    label: "{{ item.split(sr_tab) | first }}"
  when: (starrocks_show_frontends.stdout_lines | default([]) | length) > 1

- name: Build backend dictionaries
  ansible.builtin.set_fact:
    starrocks_be_rows: >-
      {{ starrocks_be_rows
         + [sr_row | combine({'Host': sr_row.IP | default(sr_row.Host | default(''))})] }}
  vars:
    sr_tab: "\t"
    sr_row: >-
      {{ dict(starrocks_show_backends.stdout_lines[0].split(sr_tab)
              | zip(item.split(sr_tab))) }}
  loop: "{{ (starrocks_show_backends.stdout_lines | default([]))[1:] }}"
  loop_control:
    label: "{{ item.split(sr_tab) | first }}"
  when: (starrocks_show_backends.stdout_lines | default([]) | length) > 1

- name: Refuse unknown frontend members
  ansible.builtin.assert:
    that: >-
      (starrocks_expected_frontends
       | selectattr('host', 'equalto', item.Host)
       | selectattr('port', 'equalto', item.EditLogPort | int)
       | list
       | length) == 1
    fail_msg: >-
      Unexpected cluster member {{ item.Host }}:{{ item.EditLogPort }};
      automatic removal is forbidden
  loop: "{{ starrocks_fe_rows }}"
  loop_control:
    label: "{{ item.Host }}:{{ item.EditLogPort }}"
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Refuse unknown backend members
  ansible.builtin.assert:
    that: >-
      (starrocks_expected_backends
       | selectattr('host', 'equalto', item.Host)
       | selectattr('port', 'equalto', item.HeartbeatPort | int)
       | list
       | length) == 1
    fail_msg: >-
      Unexpected cluster member {{ item.Host }}:{{ item.HeartbeatPort }};
      automatic removal is forbidden
  loop: "{{ starrocks_be_rows }}"
  loop_control:
    label: "{{ item.Host }}:{{ item.HeartbeatPort }}"
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Refuse FE roles that conflict with inventory
  ansible.builtin.assert:
    that: >-
      (item.Role if item.Role != 'LEADER' else 'FOLLOWER')
      ==
      (starrocks_expected_frontends
       | selectattr('host', 'equalto', item.Host)
       | first).role
    fail_msg: >-
      Existing FE role conflicts with inventory at {{ item.Host }}:{{ item.EditLogPort }}
  loop: "{{ starrocks_fe_rows }}"
  loop_control:
    label: "{{ item.Host }}:{{ item.EditLogPort }}"
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Refuse backends that are being decommissioned
  ansible.builtin.assert:
    that:
      - (item.SystemDecommissioned | default('false') | lower) != 'true'
      - (item.ClusterDecommissioned | default('false') | lower) != 'true'
    fail_msg: "Backend {{ item.Host }}:{{ item.HeartbeatPort }} is being decommissioned"
  loop: "{{ starrocks_be_rows }}"
  loop_control:
    label: "{{ item.Host }}:{{ item.HeartbeatPort }}"
  no_log: true
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Require a single live frontend leader with one cluster identity
  ansible.builtin.assert:
    that:
      - >-
        (starrocks_fe_rows | selectattr('Role', 'equalto', 'LEADER')
         | selectattr('Alive', 'equalto', 'true') | list | length) == 1
      - (starrocks_fe_rows | map(attribute='ClusterId') | unique | list | length) == 1
    fail_msg: >-
      A single live FE leader with one agreed cluster ID is required;
      never force a new cluster over existing metadata
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Record the elected frontend leader
  ansible.builtin.set_fact:
    starrocks_leader_host: >-
      {{ starrocks_fe_rows | selectattr('Role', 'equalto', 'LEADER')
         | selectattr('Alive', 'equalto', 'true') | map(attribute='Host') | first }}
    # start_fe.sh --helper takes host:edit_log_port, so the port travels with it.
    starrocks_leader_edit_log_port: >-
      {{ starrocks_fe_rows | selectattr('Role', 'equalto', 'LEADER')
         | selectattr('Alive', 'equalto', 'true')
         | map(attribute='EditLogPort') | first }}
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Require complete cluster membership
  ansible.builtin.assert:
    that:
      - (starrocks_expected_frontends | length) == (starrocks_fe_rows | length)
      - (starrocks_expected_backends | length) == (starrocks_be_rows | length)
    fail_msg: "Cluster membership is incomplete"
  when:
    - starrocks_state_complete | default(false) | bool
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Require every cluster member to be alive and on the pinned version
  ansible.builtin.assert:
    that:
      - (item.Alive | lower) == 'true'
      - (item.Version | split('-') | first) == (starrocks_version | string)
    fail_msg: "Cluster member {{ item.Host }} is not alive or is on an unexpected version"
  loop: "{{ starrocks_fe_rows + starrocks_be_rows }}"
  loop_control:
    label: "{{ item.Host }} ({{ item.Version }})"
  no_log: true
  when:
    - starrocks_state_complete | default(false) | bool
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)
