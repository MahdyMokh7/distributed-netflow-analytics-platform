---
starrocks_archive_url:
  "https://store.inside.sahab.ir/repository/Raw-Hosted-Nebula/dist/starrocks/StarRocks-{{ starrocks_version }}-ubuntu-amd64.tar.gz"
starrocks_cache_dir: "{{ starrocks_mount }}/starrocks_archives"

starrocks_sysctl_settings:
  vm.max_map_count: "262144"
  vm.swappiness: "0"
  vm.overcommit_memory: "1"

starrocks_ntp_servers: []

starrocks_chrony_package: chrony
starrocks_chrony_conf: "{{ '/etc/chrony/chrony.conf' if ansible_facts.os_family == 'Debian' else '/etc/chrony.conf' }}"

starrocks_clock_sync_tries: 30
starrocks_max_clock_correction: 0.5
