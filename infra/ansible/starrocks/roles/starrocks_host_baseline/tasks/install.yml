---
- name: Create the service group
  ansible.builtin.group:
    name: "{{ starrocks_group }}"
    system: true

- name: Create the locked service account
  ansible.builtin.user:
    name: "{{ starrocks_user }}"
    group: "{{ starrocks_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    password_lock: true

- name: Create persistent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ starrocks_user }}"
    group: "{{ starrocks_group }}"
    mode: '0750'
  loop:
    - "{{ starrocks_meta_dir }}"
    - "{{ starrocks_storage_dir }}"
    - "{{ starrocks_log_dir }}"
    - "{{ starrocks_log_dir }}/fe"
    - "{{ starrocks_log_dir }}/be"

- name: Ensure preserved files are owned by the service account
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    recurse: true
    owner: "{{ starrocks_user }}"
    group: "{{ starrocks_group }}"
  loop:
    - "{{ starrocks_meta_dir }}"
    - "{{ starrocks_storage_dir }}"

- name: Create artifact cache
  ansible.builtin.file:
    path: "{{ starrocks_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Fetch the pinned release
  ansible.builtin.get_url:
    url: "{{ starrocks_archive_url }}"
    dest: "{{ starrocks_cache_dir }}/StarRocks-{{ starrocks_version }}.tar.gz"
    owner: root
    group: root
    mode: '0644'
    timeout: 600

- name: Extract the release once
  ansible.builtin.unarchive:
    src: "{{ starrocks_cache_dir }}/StarRocks-{{ starrocks_version }}.tar.gz"
    dest: /opt
    remote_src: true
    owner: root
    group: root
    creates: "{{ starrocks_install_dir }}/.ansible-extracted"

- name: Create the frontend plugins directory
  ansible.builtin.file:
    path: "{{ starrocks_install_dir }}/fe/plugins"
    state: directory
    owner: "{{ starrocks_user }}"
    group: "{{ starrocks_group }}"
    mode: '0750'

- name: Hand StarRocks installation to service account
  ansible.builtin.file:
    path: "{{ starrocks_install_dir }}"
    owner: "{{ starrocks_user }}"
    group: "{{ starrocks_group }}"

- name: Record successful extraction
  ansible.builtin.copy:
    content: "{{ starrocks_archive_url }}\n"
    dest: "{{ starrocks_install_dir }}/.ansible-extracted"
    owner: root
    group: root
    mode: '0644'

- name: Link the active release
  ansible.builtin.file:
    src: "{{ starrocks_install_dir }}"
    dest: "{{ starrocks_link }}"
    state: link
