---
- name: Import SQL topology context
  ansible.builtin.import_tasks: context.yml

- name: Import the live cluster state
  ansible.builtin.import_tasks: cluster_state.yml


- name: Define the managed application accounts
  ansible.builtin.set_fact:
    starrocks_accounts:
      - name: "{{ starrocks_writer }}"
        role: "{{ starrocks_writer }}_role"
        password: "{{ vault_starrocks_writer_password }}"
        database_privilege: "{{ starrocks_writer_database_privilege }}"

      - name: "{{ starrocks_reader }}"
        role: "{{ starrocks_reader }}_role"
        password: "{{ vault_starrocks_reader_password }}"
        database_privilege: ""

- name: Validate the writer database privilege token
  ansible.builtin.assert:
    that: (starrocks_writer_database_privilege | upper) is match('^[A-Z]+( [A-Z]+)*$')
    fail_msg: "Invalid database privilege token {{ starrocks_writer_database_privilege }}"
  when: (starrocks_writer_database_privilege | string | length) > 0

- name: Reconcile the root account
  ansible.builtin.command:
    argv:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        pw=$(printf '%s' "$SR_NEWPW" | sed "s/'/''/g")
        MYSQL_PWD="$SR_PW" mysql --connect-timeout=3 -h "{{ starrocks_sql_host }}" -P "{{ starrocks_connection.login_port }}" \
          -u root -e "SET PASSWORD = PASSWORD('${pw}')" \
          || MYSQL_PWD="$SR_PW" mysql --connect-timeout=3 -h "{{ starrocks_sql_host }}" -P "{{ starrocks_connection.login_port }}" \
          -u root -e "ALTER USER 'root'@'%' IDENTIFIED BY '${pw}'"
  environment:
    SR_PW: "{{ starrocks_sql_pw }}"
    SR_NEWPW: "{{ vault_starrocks_root_password }}"
  changed_when: true
  check_mode: false
  no_log: true
  when:
    - (starrocks_sql_pw_idx | default('vault')) != 'vault'
    - not ansible_check_mode

- name: Refresh the live cluster state after the root rotation
  ansible.builtin.import_tasks: cluster_state.yml
  when:
    - (starrocks_sql_pw_idx | default('vault')) != 'vault'
    - not ansible_check_mode


- name: Read the existing application roles
  ansible.builtin.command:
    argv:
      - mysql
      - --connect-timeout=3
      - "-h{{ starrocks_sql_host }}"
      - "-P{{ starrocks_connection.login_port }}"
      - "-uroot"
      - -N
      - -e
      - "SHOW ROLES"
  environment:
    MYSQL_PWD: "{{ starrocks_sql_pw }}"
  register: starrocks_show_roles
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)
- name: Record the existing role names
  ansible.builtin.set_fact:
    starrocks_roles: >-
      {{
        starrocks_show_roles.stdout_lines
        | map('split', '\t')
        | map('first')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Create the missing application roles
  ansible.builtin.command:
    argv:
      - mysql
      - --connect-timeout=3
      - "-h{{ starrocks_sql_host }}"
      - "-P{{ starrocks_connection.login_port }}"
      - "-uroot"
      - -e
      - "CREATE ROLE IF NOT EXISTS `{{ item.role }}`"
  environment:
    MYSQL_PWD: "{{ starrocks_sql_pw }}"
  changed_when: true
  check_mode: false
  no_log: false
  loop: "{{ starrocks_accounts }}"
  loop_control:
    label: "{{ item.role }}"
  when:
    - not ansible_check_mode
    - (item.role | string) not in (starrocks_roles | default([]))

- name: Read the grants of each application role
  ansible.builtin.command:
    argv:
      - mysql
      - --connect-timeout=3
      - "-h{{ starrocks_sql_host }}"
      - "-P{{ starrocks_connection.login_port }}"
      - "-uroot"
      - -e
      - "SHOW GRANTS FOR ROLE `{{ item.role }}`"
  environment:
    MYSQL_PWD: "{{ starrocks_sql_pw }}"
  register: starrocks_role_grants_raw
  changed_when: false
  check_mode: false
  no_log: true
  loop: "{{ starrocks_accounts }}"
  loop_control:
    label: "{{ item.role }}"
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Collect the role grant statements
  ansible.builtin.set_fact:
    starrocks_role_grants: >-
      {{
        dict(
          starrocks_role_grants_raw.results
          | default([])
          | selectattr('stdout_lines', 'defined')
          | map(attribute='item.role')
          | zip(
              starrocks_role_grants_raw.results
              | default([])
              | selectattr('stdout_lines', 'defined')
              | map(attribute='stdout_lines')
              | map('select', 'match', '^GRANT ')
              | map('list')
            )
        )
      }}
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Initialize desired role grants
  ansible.builtin.set_fact:
    starrocks_role_desired_grants: {}

- name: Compute desired role grants
  ansible.builtin.set_fact:
    starrocks_role_desired_grants: >-
      {{
        starrocks_role_desired_grants
        | combine(
            {
              item.role:
                (
                  [
                    'GRANT USAGE ON CATALOG default_catalog TO ROLE `' ~ item.role ~ '`'
                  ]
                  +
                  (
                    [
                      'GRANT ' ~ item.database_privilege ~
                      ' ON DATABASE `' ~ starrocks_database ~
                      '` TO ROLE `' ~ item.role ~ '`'
                    ]
                    if item.database_privilege else []
                  )
                )
            }
          )
      }}
  loop: "{{ starrocks_accounts }}"


- name: Reset the accounts-with-grants working list
  ansible.builtin.set_fact:
    starrocks_accounts_with_grants: []

- name: Attach desired grants to each account
  ansible.builtin.set_fact:
    starrocks_accounts_with_grants: >-
      {{ starrocks_accounts_with_grants + [item | combine({'desired_grants': starrocks_role_desired_grants[item.role]})] }}
  loop: "{{ starrocks_accounts }}"
  loop_control:
    label: "{{ item.role }}"

- name: Expand the desired role grant statements
  ansible.builtin.set_fact:
    starrocks_role_grant_tasks: >-
      {{
        query('subelements', starrocks_accounts_with_grants, 'desired_grants')
      }}

- name: Grant the missing application role privileges
  ansible.builtin.command:
    argv:
      - mysql
      - --connect-timeout=3
      - "-h{{ starrocks_sql_host }}"
      - "-P{{ starrocks_connection.login_port }}"
      - "-uroot"
      - -e
      - "{{ item.1 }}"
  environment:
    MYSQL_PWD: "{{ starrocks_sql_pw }}"
  changed_when: true
  check_mode: false
  no_log: false
  loop: "{{ starrocks_role_grant_tasks }}"
  loop_control:
    label: "{{ item.0.role }}"
  when:
    - not ansible_check_mode
    - >-
      (item.1 | replace('`', '') | replace('"', '') | replace("'", '')
       | regex_replace('[ \t]+', '') | regex_replace(';\s*$', '') | lower)
      not in (starrocks_role_grants[item.0.role]
              | map('replace', '`', '') | map('replace', '"', '') | map('replace', "'", '')
              | map('regex_replace', '[ \t]+', '') | map('regex_replace', ';\s*$', '')
              | map('lower') | list)

- name: Read the existing application users
  ansible.builtin.command:
    argv:
      - mysql
      - --connect-timeout=3
      - "-h{{ starrocks_sql_host }}"
      - "-P{{ starrocks_connection.login_port }}"
      - "-uroot"
      - -N
      - -e
      - "SHOW USERS"
  environment:
    MYSQL_PWD: "{{ starrocks_sql_pw }}"
  register: starrocks_show_users
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Record the existing application users
  ansible.builtin.set_fact:
    starrocks_users: "{{ starrocks_show_users.stdout_lines | map('trim') | reject('equalto', '') | list }}"
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Create the missing application accounts
  ansible.builtin.command:
    argv:
      - mysql
      - --connect-timeout=3
      - "-h{{ starrocks_sql_host }}"
      - "-P{{ starrocks_connection.login_port }}"
      - "-uroot"
      - -e
      - "CREATE USER `{{ item.name }}`@`{{ starrocks_account_host }}` IDENTIFIED BY '{{ item.password }}'"
  environment:
    MYSQL_PWD: "{{ starrocks_sql_pw }}"
  changed_when: true
  check_mode: false
  no_log: false
  loop: "{{ starrocks_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - ("'" ~ item.name ~ "'@'" ~ starrocks_account_host ~ "'") not in (starrocks_users | default([]))

- name: Probe the application account logins
  ansible.builtin.command:
    argv:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        err=$(MYSQL_PWD="$SR_ACPW" mysql --connect-timeout=3 -h "{{ starrocks_sql_host }}" -P "{{ starrocks_connection.login_port }}" -u "{{ item.name }}" -e "SELECT 1" 2>&1 >/dev/null) || true
        if [ -z "$err" ]; then
          echo ok
        elif [[ "$err" == *"Access denied"* ]]; then
          echo denied
        else
          echo unreachable
        fi
  environment:
    SR_ACPW: "{{ item.password }}"
  register: starrocks_account_probe
  changed_when: false
  check_mode: false
  no_log: true
  loop: "{{ starrocks_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)
    - ((item.name | string ~ '@' ~ starrocks_account_host) in (starrocks_users | default([]))) or not ansible_check_mode

- name: Record the login probe outcomes
  ansible.builtin.set_fact:
    starrocks_account_probe_map: >-
      {{
        dict(
          starrocks_account_probe.results
          | default([])
          | selectattr('stdout', 'defined')
          | map(attribute='item.name')
          | zip(
              starrocks_account_probe.results
              | default([])
              | selectattr('stdout', 'defined')
              | map(attribute='stdout')
              | map('trim')
            )
        )
      }}
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Require decisive application login probes
  ansible.builtin.assert:
    that: >-
      (starrocks_account_probe.results | default([]) | selectattr('stdout', 'defined')
       | map(attribute='stdout') | map('trim')
       | select('equalto', 'unreachable') | list | length) == 0
    fail_msg: "An application account could not be probed on the cluster"
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Require the application accounts to authenticate
  ansible.builtin.assert:
    that: >-
      (starrocks_account_probe.results | default([]) | selectattr('stdout', 'defined')
       | map(attribute='stdout') | map('trim')
       | select('equalto', 'denied') | list | length) == 0
    fail_msg: "Application authentication failed; the account passwords differ from the vault"
  when:
    - ansible_check_mode
    - starrocks_fe_metadata_present | bool

- name: Reset the application account password on authentication failure
  ansible.builtin.command:
    argv:
      - mysql
      - --connect-timeout=3
      - "-h{{ starrocks_sql_host }}"
      - "-P{{ starrocks_connection.login_port }}"
      - "-uroot"
      - -e
      - "ALTER USER `{{ item.name }}`@`{{ starrocks_account_host }}` IDENTIFIED BY '{{ item.password }}'"
  environment:
    MYSQL_PWD: "{{ starrocks_sql_pw }}"
  changed_when: true
  check_mode: false
  no_log: true
  loop: "{{ starrocks_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - ((starrocks_account_probe_map | default({})).get(item.name, 'skipped')) == 'denied'

- name: Read the effective roles of each application account
  ansible.builtin.command:
    argv:
      - bash
      - -euo
      - pipefail
      - -c
      - >-
        MYSQL_PWD="$SR_ACPW" mysql --connect-timeout=3
        -h "{{ starrocks_sql_host }}" -P "{{ starrocks_connection.login_port }}"
        -u "{{ item.name }}" -N -e "SELECT current_role()"
  environment:
    SR_ACPW: "{{ item.password }}"
  register: starrocks_current_roles
  changed_when: false
  check_mode: false
  no_log: true
  loop: "{{ starrocks_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)
    - >-
      ((starrocks_account_probe_map | default({})).get(item.name, 'skipped')) == 'ok'
      or (not ansible_check_mode
          and ((starrocks_account_probe_map | default({})).get(item.name, 'skipped')) == 'denied')

- name: Record the effective account roles
  ansible.builtin.set_fact:
    starrocks_current_roles_map: >-
      {{
        dict(
          starrocks_current_roles.results
          | default([])
          | selectattr('stdout', 'defined')
          | map(attribute='item.name')
          | zip(
              starrocks_current_roles.results
              | default([])
              | selectattr('stdout', 'defined')
              | map(attribute='stdout')
              | map('trim')
            )
        )
      }}
  when:
    - not ansible_check_mode or (starrocks_fe_metadata_present | bool)

- name: Grant application roles to accounts
  ansible.builtin.command:
    argv:
      - mysql
      - --connect-timeout=3
      - "-h{{ starrocks_sql_host }}"
      - "-P{{ starrocks_connection.login_port }}"
      - "-uroot"
      - -e
      - "GRANT `{{ item.role }}` TO `{{ item.name }}`@`{{ starrocks_account_host }}`"
  environment:
    MYSQL_PWD: "{{ starrocks_sql_pw }}"
  changed_when: true
  check_mode: false
  loop: "{{ starrocks_accounts }}"
  loop_control:
    label: "{{ item.name }}"


- name: Set the application account default role
  ansible.builtin.command:
    argv:
      - mysql
      - --connect-timeout=3
      - "-h{{ starrocks_sql_host }}"
      - "-P{{ starrocks_connection.login_port }}"
      - "-uroot"
      - -e
      - "SET DEFAULT ROLE `{{ item.role }}` TO `{{ item.name }}`@`{{ starrocks_account_host }}`"
  environment:
    MYSQL_PWD: "{{ starrocks_sql_pw }}"
  changed_when: true
  check_mode: false
  no_log: false
  loop: "{{ starrocks_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - >-
      ((starrocks_account_probe_map | default({})).get(item.name, 'skipped') in ['ok', 'denied'])
      and (((starrocks_current_roles_map | default({})).get(item.name, '') | split(',')
            | map('trim') | map('replace', '`', '') | map('replace', "'", '') | map('replace', '"', '')
            | map('trim') | reject('equalto', 'public') | reject('equalto', '') | list)
           != [item.role])
