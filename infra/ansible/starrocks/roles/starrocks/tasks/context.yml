---
- name: Build expected frontend membership
  ansible.builtin.set_fact:
    starrocks_expected_frontends: >-
      {{ (starrocks_expected_frontends | default([])) | rejectattr('host', 'equalto', hostvars[item].starrocks_address) | list
         + [{'host': hostvars[item].starrocks_address, 'port': starrocks_edit_log_port | int,
             'role': 'FOLLOWER' if item in groups['starrocks_fe_voters'] else 'OBSERVER'}] }}
  loop: "{{ groups['starrocks_fe'] }}"

- name: Build expected backend membership
  ansible.builtin.set_fact:
    starrocks_expected_backends: >-
      {{ (starrocks_expected_backends | default([])) | rejectattr('host', 'equalto', hostvars[item].starrocks_address) | list
         + [{'host': hostvars[item].starrocks_address, 'port': starrocks_heartbeat_port | int}] }}
  loop: "{{ groups['starrocks_be'] }}"

- name: Set protected SQL connection parameters
  ansible.builtin.set_fact:
    starrocks_connection:
      login_hosts: "{{ starrocks_login_hosts }}"
      login_port: "{{ starrocks_query_port | int }}"
      login_password: "{{ vault_starrocks_root_password }}"
      previous_password: "{{ vault_starrocks_previous_root_password | default(None) }}"
      expected_frontends: "{{ starrocks_expected_frontends }}"
      expected_backends: "{{ starrocks_expected_backends }}"
  no_log: true
