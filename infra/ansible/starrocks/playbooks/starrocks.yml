---
- name: Inspect every host and validate the inventory before any mutation
  hosts: starrocks
  become: true
  any_errors_fatal: true
  tasks:
    - name: Validate inventory and preserved data on each host
      ansible.builtin.import_role:
        name: starrocks
        tasks_from: preflight

- name: Validate the whole cluster identity before any mutation
  hosts: "{{ starrocks_bootstrap_host }}"
  become: true
  any_errors_fatal: true
  gather_facts: false
  tasks:
    - name: Validate cross-host cluster identity
      ansible.builtin.import_role:
        name: starrocks
        tasks_from: cluster

- name: Prepare runtime and services
  hosts: starrocks
  become: true
  any_errors_fatal: true
  tasks:
    - name: Prepare runtime, services and firewall
      ansible.builtin.import_role:
        name: starrocks
        tasks_from: prepare
    - name: Recover previously initialized frontends together
      ansible.builtin.systemd_service:
        name: starrocks-fe
        state: started
        enabled: true
        daemon_reload: true
      when:
        - inventory_hostname in groups['starrocks_fe']
        - starrocks_disk.has_metadata
    - name: Bootstrap one frontend on an empty cluster
      ansible.builtin.include_role:
        name: starrocks
        tasks_from: bootstrap
      when:
        - inventory_hostname == starrocks_bootstrap_host
        - >-
          0 == (groups['starrocks'] | map('extract', hostvars, 'starrocks_disk')
                | selectattr('has_metadata') | list | length)

- name: Reconcile frontends one at a time
  hosts: starrocks_fe
  become: true
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Join and configure the frontend
      ansible.builtin.import_role:
        name: starrocks
        tasks_from: frontend

- name: Reconcile backends one at a time
  hosts: starrocks_be
  become: true
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Register and configure the backend
      ansible.builtin.import_role:
        name: starrocks
        tasks_from: backend

- name: Provision the application database and accounts
  hosts: starrocks_fe_voters[0]
  become: true
  any_errors_fatal: true
  tasks:
    - name: Reconcile schema and credentials
      ansible.builtin.import_role:
        name: starrocks
        tasks_from: provision

- name: Verify the resulting deployment
  ansible.builtin.import_playbook: verify-starrocks.yml
