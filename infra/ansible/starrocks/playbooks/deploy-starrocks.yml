---
- name: Preflight - validate inventory, prerequisites and persisted state before any mutation
  hosts: starrocks
  become: true
  any_errors_fatal: true
  roles:
    - starrocks_preflight

- name: Prepare hosts
  hosts: starrocks
  become: true
  any_errors_fatal: true
  gather_facts: false
  roles:
    - starrocks_host_baseline

- name: Configure frontends
  hosts: starrocks_fe
  become: true
  any_errors_fatal: true
  gather_facts: false
  roles:
    - starrocks_fe

- name: Configure backends
  hosts: starrocks_be
  become: true
  any_errors_fatal: true
  gather_facts: false
  roles:
    - starrocks_be

- name: Form the frontend quorum
  hosts: starrocks_fe
  become: true
  any_errors_fatal: true
  gather_facts: false
  roles:
    - starrocks_cluster_formation

- name: Reconcile frontends one at a time
  hosts: starrocks_fe
  become: true
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  roles:
    - role: starrocks_fe
      tasks_from: join

- name: Reconcile backends one at a time
  hosts: starrocks_be
  become: true
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  roles:
    - role: starrocks_be
      tasks_from: join

- name: Verify the resulting deployment
  ansible.builtin.import_playbook: verify-deploy-starrocks.yml
