---
name: unknown_frontend
description: >-
  A live FE (10.0.0.99) is not in the expected inventory membership at all.
  Must be refused rather than silently accepted.

frontends_stdout_lines:
  - "Name\tIP\tEditLogPort\tRole\tAlive\tClusterId"
  - "fe_1\t10.0.0.11\t9010\tLEADER\ttrue\t111222333"
  - "fe_x\t10.0.0.99\t9010\tFOLLOWER\ttrue\t111222333"

backends_stdout_lines:
  - "IP\tHeartbeatPort\tSystemDecommissioned\tClusterDecommissioned"
  - "10.0.0.21\t9050\tfalse\tfalse"

expected_frontends:
  - {host: "10.0.0.11", port: 9010, role: FOLLOWER}

expected_backends:
  - {host: "10.0.0.21", port: 9050}

expect:
  result: fail
  fail_msg_contains: "Unexpected cluster member 10.0.0.99:9010"
