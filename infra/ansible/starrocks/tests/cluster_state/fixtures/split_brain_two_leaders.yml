---
name: split_brain_two_leaders
description: >-
  Two FEs both report Role=LEADER and Alive=true at the same time - a split
  brain. Must be refused; never elect either as *the* leader.

frontends_stdout_lines:
  - "Name\tIP\tEditLogPort\tRole\tAlive\tClusterId"
  - "fe_1\t10.0.0.11\t9010\tLEADER\ttrue\t111222333"
  - "fe_2\t10.0.0.12\t9010\tLEADER\ttrue\t111222333"
  - "fe_3\t10.0.0.13\t9010\tFOLLOWER\ttrue\t111222333"

backends_stdout_lines:
  - "IP\tHeartbeatPort\tSystemDecommissioned\tClusterDecommissioned"
  - "10.0.0.21\t9050\tfalse\tfalse"

expected_frontends:
  - {host: "10.0.0.11", port: 9010, role: FOLLOWER}
  - {host: "10.0.0.12", port: 9010, role: FOLLOWER}
  - {host: "10.0.0.13", port: 9010, role: FOLLOWER}

expected_backends:
  - {host: "10.0.0.21", port: 9050}

expect:
  result: fail
  fail_msg_contains: "A single live FE leader with one agreed cluster ID is required"
