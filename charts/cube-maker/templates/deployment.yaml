apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "MODULE.fullname" . }}
  labels:
    {{- include "MODULE.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "MODULE.labels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "MODULE.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}

            {{- if .Values.sparkUiService.enabled }}
            - name: spark-ui
              containerPort: {{ .Values.sparkUiPort }}
              protocol: TCP
            {{- end }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfile | quote }}
            - name: SERVER_PORT
              value: {{ .Values.containerPort | quote }}
            - name: HDFS_URI
              value: {{ required "hdfs.uri is required" .Values.hdfs.uri | quote }}
            - name: POSTGRES_HOST
              value: {{ required "postgres.host is required" .Values.postgres.host | quote }}
            - name: EXECUTOR_POOL_SIZE
              value: {{ required "postgres.executorPool.maxPoolSize is required" .Values.postgres.executorPool.maxPoolSize | quote }}
            - name: EXECUTOR_MINIMUM_IDLE
              value: {{ .Values.postgres.executorPool.minimumIdle | quote }}
            - name: EXECUTOR_CONNECTION_TIMEOUT
              value: {{ required "postgres.executorPool.connectionTimeoutMs is required" .Values.postgres.executorPool.connectionTimeoutMs | quote }}
            - name: EXECUTOR_IDLE_TIMEOUT
              value: {{ required "postgres.executorPool.idleTimeoutMs is required" .Values.postgres.executorPool.idleTimeoutMs | quote }}
            - name: EXECUTOR_MAX_LIFETIME
              value: {{ required "postgres.executorPool.maxLifetimeMs is required" .Values.postgres.executorPool.maxLifetimeMs | quote }}
            - name: EXECUTOR_POOL_NAME
              value: {{ required "postgres.executorPool.poolName is required" .Values.postgres.executorPool.poolName | quote }}
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/config/application-prod.yaml"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.secret.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "MODULE.fullname" . }}-secret
          {{- else }}
          envFrom:
            - secretRef:
                name: {{ required "secret.existingName is required when secret.enabled is false" .Values.secret.existingName }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: hadoop-config
              mountPath: /app/resources/core-site.xml
              subPath: core-site.xml
              readOnly: true
            - name: hadoop-config
              mountPath: /app/resources/hdfs-site.xml
              subPath: hdfs-site.xml
              readOnly: true
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "MODULE.fullname" . }}-config
        - name: hadoop-config
          configMap:
            name: {{ required "hdfs.configMapName is required" .Values.hdfs.configMapName }}
            items:
              - key: core-site.xml
                path: core-site.xml
              - key: hdfs-site.xml
                path: hdfs-site.xml
