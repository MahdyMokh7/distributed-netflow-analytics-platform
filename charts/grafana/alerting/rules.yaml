apiVersion: 1
groups:
  - orgId: 1
    name: n imbyte-app-down-alerts
    folder: Nimbyte Alerts
    interval: 1m
    rules:
      - uid: nimbo-batch-ingester-down
        title: batch-ingester is down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: afx57iu9wr0n4a   # same Prometheus datasource UID used everywhere else
            model:
              editorMode: code
              expr: up{instance="batch-ingester"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "batch-ingester has been down for more than 2 minutes"

      # Copy this block 3 more times for batch-processor, realtime, rest-api —
      # or, easier: build each one in the Grafana UI against real data, then
      # Export as Code and paste the result in here instead of hand-editing.
