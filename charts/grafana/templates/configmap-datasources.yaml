apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: {{ .Values.prometheus.url }}
        uid: {{ .Values.prometheus.datasourceUid }}
        isDefault: true
        editable: true
