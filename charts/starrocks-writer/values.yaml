replicaCount: 1

image:
  repository: zoraq.inside.sahab.ir:9462/nimbo-nimbyte-starrocks-writer
  tag: "latest"
  pullPolicy: IfNotPresent

containerPort: 18082
springProfile: prod

terminationGracePeriodSeconds: 40

service:
  type: ClusterIP
  port: 18082

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  startup:
    path: /actuator/health/liveness
    timeoutSeconds: 3
    failureThreshold: 30
    periodSeconds: 5
  readiness:
    path: /actuator/health/readiness
    timeoutSeconds: 3
    failureThreshold: 3
    periodSeconds: 5
  liveness:
    path: /actuator/health/liveness
    timeoutSeconds: 3
    failureThreshold: 3
    periodSeconds: 10

secret:
  enabled: false
  data:
    STARROCKS_USERNAME: "CHANGE_ME"
    STARROCKS_PASSWORD: "CHANGE_ME"

