image:
  repository: zoraq.inside.sahab.ir:9462/prometheus
  tag: "latest"
  pullPolicy: IfNotPresent

containerPort: 9090
retention: 15d

storage:
  className: disk1     # your existing OpenEBS local-pv StorageClass, BasePath /mnt/disk1
  size: 20Gi

service:
  type: ClusterIP
  port: 9090

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
