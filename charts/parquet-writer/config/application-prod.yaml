spring:
  application:
    name: parquet-writer
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    activate:
      on-profile: prod

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        http.server.requests: true

server:
  shutdown: graceful
  port: 18080
logging:
  level:
    com.nimbo.ingester: INFO
    com.nimbo.storage: INFO
ingester:
  schema-registry:
    url: ${SCHEMA_REGISTRY_URL}
    subject: ${SCHEMA_REGISTRY_SUBJECT}
  kafka:
    bootstrap-servers: 10.10.61.51:9092,10.10.61.53:9092,10.10.61.54:9092
    topic: multi-version-netflow
    dlq-topic: netflow-dlq
    late-topic: netflow-late
    consumer-group: multi-version-parquet-writer
    consumer-instances: 3
    enable-auto-commit: false
    poll-timeout-ms: 1000
    max-poll-records: 5000
    session-timeout-ms: 30000
    heartbeat-interval-ms: 3000
    max-poll-interval-ms: 300000
    auto-offset-reset: earliest
storage:
  hdfs:
    uri: hdfs://team1
    base-path: /netflow/parquetFiles
    nameservice: team1
    nodes:
      team1-node3: 10.10.61.53:8020
      team1-node1: 10.10.61.51:8020
      team1-node2: 10.10.61.52:8020
  parquet:
    compression-codec: ZSTD
    block-size-bytes: 67108864
    page-size-bytes: 1048576
    enable-dictionary: true
rolling:
  max-record-count: 5000000
  max-size-bytes: 629145600
  max-age: 30m
  allowed-lateness-hours: 1
  late-routing-enabled: ${LATE_ROUTING_ENABLED:false}
