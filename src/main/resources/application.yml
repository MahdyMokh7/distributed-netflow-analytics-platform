# Main application configuration
spring:
  application:
    name: nimbo
  
  # Profiles
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # Logging
  output:
    ansi:
      enabled: always

# Logging configuration
logging:
  level:
    root: INFO
    com.nimbo.ingester: INFO
    org.apache.kafka: WARN
    org.apache.hadoop: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Kafka configuration
kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  topic: ${KAFKA_TOPIC:netflow}
  consumer-group: ${KAFKA_CONSUMER_GROUP:parquet-writer}
  enable-auto-commit: false
  poll-timeout-ms: 1000
  max-poll-records: 500
  session-timeout-ms: 30000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000

rolling:
  max-record-count: ${ROLLING_MAX_RECORD_COUNT:50000}
  max-size-bytes: ${ROLLING_MAX_SIZE_BYTES:67108864}
  max-age: ${ROLLING_MAX_AGE:2m}

storage:
  parquet:
    compression-codec: ${PARQUET_COMPRESSION:SNAPPY}
    block-size-bytes: ${PARQUET_BLOCK_SIZE:134217728}
    page-size-bytes: ${PARQUET_PAGE_SIZE:1048576}
    enable-dictionary: ${PARQUET_ENABLE_DICTIONARY:true}

# Health and metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

# Thread pool configuration
executor:
  core-pool-size: 4
  max-pool-size: 8
  queue-capacity: 100
  thread-name-prefix: ingester-
