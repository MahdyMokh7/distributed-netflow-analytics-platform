# Main application configuration
spring:
  application:
    name: nimbo
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  output:
    ansi:
      enabled: always

logging:
  level:
    root: INFO
    com.nimbo.ingester: INFO
    org.apache.kafka: WARN
    org.apache.hadoop: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

rolling:
  max-record-count: ${ROLLING_MAX_RECORD_COUNT:8000000}
  max-size-bytes: ${ROLLING_MAX_SIZE_BYTES:805306368}
  max-age: ${ROLLING_MAX_AGE:2m}

storage:
  parquet:
    compression-codec: ${PARQUET_COMPRESSION:SNAPPY}
    block-size-bytes: ${PARQUET_BLOCK_SIZE:134217728}
    page-size-bytes: ${PARQUET_PAGE_SIZE:1048576}
    enable-dictionary: ${PARQUET_ENABLE_DICTIONARY:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

ingester:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:10.10.61.51:9092,10.10.61.53:9092,10.10.61.54:9092}
    topic: ${KAFKA_TOPIC:netflow}
    consumer:
      auto-offset-reset: earliest
    dlq-topic: ${KAFKA_DLQ_TOPIC:netflow-dlq}
    consumer-group: ${KAFKA_CONSUMER_GROUP:netflow-java-consumer-scalled}
    enable-auto-commit: false
    poll-timeout-ms: 1000
    max-poll-records: 5000
    session-timeout-ms: 30000
    heartbeat-interval-ms: 3000
    max-poll-interval-ms: 300000

    consumer-instances: ${CONSUMER_INSTANCES:1}