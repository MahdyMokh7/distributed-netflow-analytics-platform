# Development-specific configuration
spring:
  config:
    activate:
      on-profile: dev

kafka:
  bootstrap-servers: kafka:9092

hdfs:
  uri: hdfs://namenode:9000

logging:
  level:
    com.nimbo.ingester: DEBUG

storage:
  hdfs:
    uri: ${HDFS_URI:hdfs://localhost:9000}
    user: root
    base-path: ${HDFS_BASE_PATH:/data/test/netflow}