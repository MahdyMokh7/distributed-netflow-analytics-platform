# Production-specific configuration
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    com.nimbo.ingester: INFO
    com.nimbo.storage: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:10.10.61.51:9092,10.10.61.53:9092,10.10.61.54:9092}
  topic: ${KAFKA_TOPIC:netflow}
  dlq-topic: ${KAFKA_DLQ_TOPIC:netflow-dlq}
  consumer-group: ${KAFKA_CONSUMER_GROUP:netflow-java-consumer-scalled}
  consumer:
    auto-offset-reset: earliest

#                  in server must do:
#
#                  kafka-topics.sh \
#                  --bootstrap-server 10.10.61.51:9092 \
#                  --create \
#                  --topic netflow-dlq \
#                  --partitions 3 \
#                  --replication-factor 3

storage:
  hdfs:
    uri: ${HDFS_URI:hdfs://team1}
    base-path: ${HDFS_BASE_PATH:/netflow/parquet-1}
    nameservice: team1
    nodes:
      team1-node1: ${HDFS_NODE1:10.10.61.51:8020}
      team1-node2: ${HDFS_NODE2:10.10.61.52:8020}
      team1-node3: ${HDFS_NODE3:10.10.61.53:8020}

ingester:
  kafka:
    consumer-instances: ${CONSUMER_INSTANCES:3}