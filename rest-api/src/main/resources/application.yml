spring:
  application:
    name: rest-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nimbo}
    username: ${DB_USER:nimbo}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 2000
      pool-name: NimboHikariPool
      auto-commit: false
      connection-test-query: SELECT 1

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 1000
        default_batch_fetch_size: 20
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
    open-in-view: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=300s

  jackson:
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048

logging:
  level:
    com.nimbo.restapi: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# API Configuration
api:
  pagination:
    default-size: 20
    max-size: 100
    max-offset: 10000
  time-range:
    max-days: 7
    default-days: 1
  rate-limit:
    enabled: true
    requests-per-minute: 100

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
  packages-to-scan: com.nimbo.restapi.controller
  paths-to-match: /v1/**

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      database:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      database:
        max-attempts: 3
        wait-duration: 100ms
        retry-exceptions:
          - org.springframework.dao.DataAccessException
          - org.hibernate.exception.JDBCConnectionException

nimbo:
  starrocks-query:
    jdbc-url: ${STARROCKS_QUERY_JDBC_URL:jdbc:mysql://10.10.61.53:9030/nimbo}
    username: ${STARROCKS_QUERY_USERNAME:root}
    password: ${STARROCKS_QUERY_PASSWORD:s@hWater}
    database: ${STARROCKS_QUERY_DATABASE:nimbo}
    table: ${STARROCKS_QUERY_TABLE:netflow_realtime_v3}

    maximum-pool-size: ${STARROCKS_QUERY_POOL_SIZE:10}
    query-timeout-seconds: ${STARROCKS_QUERY_TIMEOUT_SECONDS:30}
    max-rows: ${STARROCKS_QUERY_MAX_ROWS:1000}